name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall .
      - name: Repository validator
        run: python scripts/validate_repository.py
      - name: Site validator
        run: python scripts/validate_site.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Route dry run
        run: bash examples/sample-route-command.sh
      - name: Prompt coach dry run
        run: bash examples/sample-prompt-coach-command.sh
      - name: Installer dry run
        run: ./scripts/install.sh --skills-dir /tmp/cwo-skill-test/skills --yes --dry-run
