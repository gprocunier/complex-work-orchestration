name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -j 8 -x '(^|/)(\.git|\.beads|\.orchestration-audit|__pycache__|\.ruff_cache)(/|$)' .
      - name: Repository validator
        run: python scripts/validate_repository.py
      - name: Public-copy validator
        run: python scripts/validate_public_copy.py
      - name: Site validator
        run: python scripts/validate_site.py
      - name: Generated site shell check
        run: python scripts/generate_site.py --check
      - name: Shiki GitHub theme check
        working-directory: tools/site
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Generated SVG diagram check
        run: |
          python scripts/generate_diagrams.py --check
          python scripts/generate_diagram_themes.py --check
      - name: Maintained Markdown and legacy route checks
        run: python scripts/check_documentation.py
      - name: Worked evidence fixtures
        run: python examples/worked-evidence/run_examples.py --check
      - name: Code-health ratchets
        run: python scripts/check_code_health.py
      - name: Unit tests
        run: python scripts/run_parallel_unittest.py --workers 4 --verbose
      - name: Route dry run
        run: bash examples/sample-route-command.sh
      - name: Prompt coach dry run
        run: bash examples/sample-prompt-coach-command.sh
      - name: Run readiness validator
        run: python scripts/validate_run_readiness_plan.py examples/sample-run-readiness-plan.json
      - name: Run projection renderer
        run: python scripts/render_run_projection.py examples/sample-run-readiness-plan.json --projection run-sheet
      - name: Run wrap-up/status projection renderer
        run: python scripts/render_run_projection.py examples/sample-run-readiness-plan.json --projection wrap-up-status
      - name: Run next-version projection renderer
        run: python scripts/render_run_projection.py examples/sample-run-readiness-plan.json --projection next-version
      - name: Closure summary dry run
        run: python scripts/close_bead_with_summary.py --bead example-1 --disposition superseded --why "replaced by a follow-up Bead" --follow-up none --dry-run --json
      - name: Stale agent cleanup dry run
        run: python scripts/cleanup_stale_agents.py --dry-run --json
      - name: Installer dry run
        run: ./scripts/install.sh --skills-dir /tmp/cwo-skill-test/skills --yes --dry-run

  debian-filesystem:
    name: Required Debian 13 filesystem release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.11@sha256:4c366015f27c672f4e07184054953aad7f4b0cd7a2d05da3375f3a0e04be9342
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test-only dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Trust the checkout owned by the runner user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run required real filesystem witnesses
        run: timeout --kill-after=10 300 python -B scripts/check_release_filesystem.py

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
