<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1640" viewBox="0 0 1760 1640" role="img" aria-labelledby="title desc"><title id="title">From a plan to supervised work</title><desc id="desc">CWO scopes and sizes assignments, verifies the exact route and arms monitoring before launch, delegates one task or qualified independent tasks, supervises the running work, checks completion and evidence, then accepts or holds results. Dependent work waits for acceptance; stopped attempts are not resumed. Illustrative native execution, not an observed run.</desc><style id="diagram-theme">
