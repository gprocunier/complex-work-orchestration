    [stroke="#ffd7dd"] { stroke: #8a1730; }
    [fill="#ffe2e6"] { fill: #773344; }
    [stroke="#ffe2e6"] { stroke: #773344; }
    [fill="#101e30"] { fill: #eef3f8; }
    [stroke="#101e30"] { stroke: #eef3f8; }
