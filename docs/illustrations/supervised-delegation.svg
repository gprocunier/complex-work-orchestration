</style><defs><marker id="red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#dc364d"/></marker><marker id="blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#70b7f2"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#5ad6c1"/></marker><marker id="muted" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b6c3d6"/></marker><marker id="amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#efb46f"/></marker></defs><rect x="0" y="0" width="1760" height="1640" rx="0" fill="#0e1828" stroke="none" stroke-width="1.5"/><text x="64" y="49" fill="#dc364d" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.6">CWO  /  SUPERVISION &amp; DELEGATION  /  COMPANION TO A</text><text x="64" y="106" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0">From a plan to supervised work.</text><text x="64" y="145" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">Start with one worker. Run independent tasks in parallel only where the environment has been approved for it.</text><rect x="60" y="220" width="1080" height="124" rx="18" fill="#a9253d" stroke="#dc364d" stroke-width="1.5"/><text x="88" y="250" fill="#ffd7dd" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.3">01  PLAN THE ASSIGNMENTS</text><text x="88" y="291" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Size the whole job. Define each task.</text><text x="88" y="323" fill="#ffe2e6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Required result · permitted changes · owners · build, review and validation costs</text><rect x="60" y="424" width="1080" height="156" rx="18" fill="#142338" stroke="#3a506b" stroke-width="1.5"/><text x="88" y="454" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.3">02  PREPARE TO LAUNCH</text><text x="88" y="495" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Verify the worker. Start monitoring.</text><text x="88" y="527" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Confirm the model, tools, workspace, time and usage limits.</text><text x="88" y="556" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Save the control record and start monitoring before sending the task.</text><rect x="60" y="696" width="1080" height="188" rx="18" fill="#101e30" stroke="#57718f" stroke-width="1.5"/><rect x="80" y="722" width="300" height="136" rx="18" fill="#1b2d44" stroke="#3a506b" stroke-width="1.5"/><text x="104" y="750" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1">03  DELEGATE</text><text x="104" y="786" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Task A</text><text x="104" y="816" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Defined task + limits</text><text x="104" y="841" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Checks + evidence</text><rect x="450" y="722" width="300" height="136" rx="18" fill="#1b2d44" stroke="#3a506b" stroke-width="1.5"/><text x="474" y="750" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1">03  DELEGATE</text><text x="474" y="786" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Task B</text><text x="474" y="816" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Defined task + limits</text><text x="474" y="841" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Checks + evidence</text><rect x="820" y="722" width="300" height="136" rx="18" fill="#1b2d44" stroke="#3a506b" stroke-width="1.5"/><text x="844" y="750" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1">03  DELEGATE</text><text x="844" y="786" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Task C</text><text x="844" y="816" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Defined task + limits</text><text x="844" y="841" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Checks + evidence</text><rect x="60" y="1010" width="1080" height="156" rx="18" fill="#142338" stroke="#3a506b" stroke-width="1.5"/><text x="88" y="1040" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.3">04  CHECK &amp; DECIDE</text><text x="88" y="1081" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Verify the result. The lead decides.</text><text x="88" y="1113" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Confirm the worker stopped and its resources are released.</text><text x="88" y="1142" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Inspect actual changes, tests and review evidence.</text><rect x="60" y="1310" width="520" height="144" rx="18" fill="#142338" stroke="#3a506b" stroke-width="1.5"/><text x="88" y="1340" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.3">ACCEPTED</text><text x="88" y="1384" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0">Save work and the decision</text><text x="88" y="1422" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Unblock tasks that need this result.</text><rect x="620" y="1310" width="520" height="144" rx="18" fill="#142338" stroke="#3a506b" stroke-width="1.5"/><text x="648" y="1340" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.3">UNRESOLVED</text><text x="648" y="1384" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0">Keep unresolved work visible</text><text x="648" y="1422" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Tasks that need this result must wait.</text><rect x="1230" y="424" width="470" height="688" rx="18" fill="#142338" stroke="#3a506b" stroke-width="1.5"/><text x="1260" y="461" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">SUPERVISION</text><text x="1260" y="503" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0">Watch the run.</text><text x="1260" y="536" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">Not just the final answer.</text><text x="1260" y="598" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">WHAT IS CHECKED</text><text x="1260" y="635" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Worker identity, tools and workspace</text><text x="1260" y="663" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Progress, time and usage</text><text x="1260" y="691" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Reads, changes and validation</text><text x="1260" y="719" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Worker state and cleanup</text><text x="1260" y="776" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">WHY IT MATTERS</text><text x="1260" y="813" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Keep work within agreed limits.</text><text x="1260" y="841" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Expose unexpected actions or changes.</text><text x="1260" y="869" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Record why work was stopped.</text><text x="1260" y="925" fill="#5ad6c1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">HOW IT WORKS</text><text x="1260" y="962" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Save state; start checks before launch.</text><text x="1260" y="990" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Check observed actions, not claims.</text><text x="1260" y="1018" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Interrupt when a required check fails.</text><text x="1260" y="1046" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Preserve the evidence.</text><text x="1260" y="1074" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Verify processes and resources closed.</text><rect x="1230" y="1220" width="470" height="234" rx="18" fill="#142338" stroke="#8c6a49" stroke-width="1.5"/><text x="1260" y="1250" fill="#efb46f" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">IF A WORKER FAILS</text><text x="1260" y="1290" fill="#f2f5fb" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Stop the affected work.</text><text x="1260" y="1326" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Stop its processes; confirm cleanup.</text><text x="1260" y="1352" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Tasks that depend on it must wait.</text><text x="1260" y="1378" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Unrelated work may continue if checks pass.</text><text x="1260" y="1404" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Do not resume the stopped attempt.</text><text x="1260" y="1430" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Keep the evidence for the next decision.</text><path d="M 600 352 L 600 416" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 600 588 L 600 650" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 230 650 L 970 650" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 230 650 L 230 714" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 230 866 L 230 930" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 600 650 L 600 714" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 600 866 L 600 930" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 970 650 L 970 714" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 970 866 L 970 930" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 230 930 L 970 930" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 600 930 L 600 1002" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 600 1174 L 600 1238" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 320 1238 L 880 1238" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 320 1238 L 320 1302" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 880 1238 L 880 1302" fill="none" stroke="#dc364d" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)"/><path d="M 1222 790 L 1148 790" fill="none" stroke="#5ad6c1" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" stroke-dasharray="7 7"/><path d="M 1465 1120 L 1465 1212" fill="none" stroke="#efb46f" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#amber)"/><text x="1510" y="1178" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">On a fault</text><text x="64" y="1520" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Parallel native work is an opt-in preview: up to three workers, only in a verified environment.</text><text x="64" y="1552" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Parallel workers must not edit the same project files. Dashed arrow: live monitoring and interruption.</text><text x="64" y="1584" fill="#b6c3d6" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Concept for review · Native execution shown; contractor and local-review routes have separate contracts.</text></svg>