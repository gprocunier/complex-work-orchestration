<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="880" viewBox="0 0 1020 880" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">What survives a fresh session</title>
  <desc id="desc">Recorded earlier two-session exercise. Session 1 accepts the validator: booleans are not ports, and the list-of-errors API stays intact. Beads records that acceptance and the waiting CLI task; project files retain code, tests and HANDOFF.md. Session 2 reads both, verifies current acceptance, then adds the CLI. Missing or stale evidence requires investigation first. The current split presentation has not had a new equivalent two-fresh-session agent run; no automatic memory transfer is claimed.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <line x1="695" y1="30" x2="695" y2="395" stroke="#6a6e73" stroke-width="1.5" stroke-dasharray="7 7"/><text x="850" y="32" text-anchor="middle" font-size="18" font-weight="600">New conversation</text><text x="790" y="635" text-anchor="middle" font-size="18" font-weight="600">Yes</text><text x="455" y="505" text-anchor="middle" font-size="18" font-weight="600">No · recheck</text><g data-node="session-one" data-x="170" data-y="210" data-width="280" data-height="128"><rect x="30.0" y="146.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="171" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Session 1 · fix</text><text x="170" y="197" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">validator</text><text x="170" y="223" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Booleans are not ports</text><text x="170" y="249" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep list-of-errors API</text></g><g data-node="beads" data-x="510" data-y="100" data-width="280" data-height="128"><path d="M 370.0,50.0 C 370.0,31.0 650.0,31.0 650.0,50.0 V 150.0 C 650.0,169.0 370.0,169.0 370.0,150.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 370.0,50.0 C 370.0,69.0 650.0,69.0 650.0,50.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="510" y="83" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Beads task records</text><text x="510" y="109" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Validator accepted</text><text x="510" y="135" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Dependent CLI still waiting</text></g><g data-node="files" data-x="510" data-y="340" data-width="280" data-height="128"><path d="M 370.0,290.0 C 370.0,271.0 650.0,271.0 650.0,290.0 V 390.0 C 650.0,409.0 370.0,409.0 370.0,390.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 370.0,290.0 C 370.0,309.0 650.0,309.0 650.0,290.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="510" y="323" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Project files</text><text x="510" y="349" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Code + tests</text><text x="510" y="375" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">HANDOFF.md + evidence</text></g><g data-node="session-two" data-x="850" data-y="210" data-width="280" data-height="128"><rect x="710.0" y="146.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="184" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Session 2 · start fresh</text><text x="850" y="210" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Read both saved records</text><text x="850" y="236" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check current code + tests</text></g><g data-node="acceptance" data-x="850" data-y="520" data-width="280" data-height="140"><polygon points="850,450.0 990.0,520 850,590.0 710.0,520" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="850" y="507" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600">Acceptance verified?</text><text x="850" y="533" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Current evidence?</text></g><g data-node="cli" data-x="680" data-y="770" data-width="280" data-height="128"><rect x="540.0" y="706.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="680" y="744" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Add the CLI</text><text x="680" y="770" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Preserve accepted behavior</text><text x="680" y="796" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Then test the new command</text></g><g data-node="investigate" data-x="340" data-y="770" data-width="280" data-height="128"><rect x="200.0" y="706.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="340" y="744" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Investigate first</text><text x="340" y="770" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Missing or stale evidence</text><text x="340" y="796" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not start the CLI yet</text></g><path data-from="session-one" data-to="beads" d="M 310,210 H 340 V 100 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="session-one" data-to="files" d="M 310,210 H 340 V 340 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="beads" data-to="session-two" d="M 650,100 H 680 V 185 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="files" data-to="session-two" d="M 650,340 H 680 V 235 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="session-two" data-to="acceptance" d="M 850,274 V 444" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="acceptance" data-to="cli" d="M 850,590 V 645 H 680 V 700" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="acceptance" data-to="investigate" d="M 710,520 H 340 V 700" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
