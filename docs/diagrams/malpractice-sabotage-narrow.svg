<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1480" viewBox="0 0 360 1480" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">A usable answer can still need review</title>
  <desc id="desc">Illustrative evaluation map. Evidence disposition and required process/peer-review status are separate results, not successive or mutually exclusive verdicts. A usable answer can still be held from implementation pending review. Unsafe or boundary-unresolved evidence stays isolated with broader reuse restrictions. Honest disclosure of provider limits is not automatic rejection.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="return" data-to="evidence" d="M 180,180 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="return" data-to="review" d="M 320,100 H 344 V 860 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evidence" data-to="both" d="M 40,340 H 16 V 1120 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="review" data-to="both" d="M 180,940 V 1034" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evidence" data-to="isolated" d="M 180,420 V 514" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="both" data-to="decision" d="M 180,1200 V 1294" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="return" data-x="180" data-y="100" data-width="280" data-height="160"><rect x="40.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="52" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check the returned</text><text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">answer</text><text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence + allowed actions</text><text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Two separate results</text><text x="180" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">follow</text></g><g data-node="evidence" data-x="180" data-y="340" data-width="280" data-height="160"><rect x="40.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="292" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">1 · Evidence</text><text x="180" y="316" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">disposition</text><text x="180" y="340" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Usable, rejected or</text><text x="180" y="364" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">isolated</text><text x="180" y="388" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Record reasons + risks</text></g><g data-node="review" data-x="180" data-y="860" data-width="280" data-height="160"><rect x="40.0" y="780.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="824" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">2 · Required review</text><text x="180" y="848" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">status</text><text x="180" y="872" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Process / peer review</text><text x="180" y="896" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Pending or complete</text></g><g data-node="both" data-x="180" data-y="1120" data-width="280" data-height="160"><rect x="40.0" y="1040.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1072" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Lead checks both</text><text x="180" y="1096" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">results</text><text x="180" y="1120" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Usable does not mean ready</text><text x="180" y="1144" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Required review must</text><text x="180" y="1168" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">finish</text></g><g data-node="isolated" data-x="180" data-y="600" data-width="280" data-height="160"><rect x="40.0" y="520.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="552" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Keep unsafe evidence</text><text x="180" y="576" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">apart</text><text x="180" y="600" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Resolve boundaries first</text><text x="180" y="624" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Broader reuse is</text><text x="180" y="648" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">restricted</text></g><g data-node="decision" data-x="180" data-y="1380" data-width="280" data-height="160"><rect x="40.0" y="1300.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1332" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Record permitted</text><text x="180" y="1356" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">changes</text><text x="180" y="1380" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check evidence + authority</text><text x="180" y="1404" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not implement held</text><text x="180" y="1428" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">advice</text></g>
</svg>
