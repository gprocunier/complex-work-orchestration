<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">Evidence before consensus</title>
  <desc id="desc">Evaluate returns, group their trust domains, compare structured claims, and report agreement and divergence before architect adjudication. Agreement alone does not establish correctness.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a60000"/></marker></defs>
  <path data-from="0" data-to="1" d="M 290,80 H 384" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="1" data-to="2" d="M 520,136 V 198" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="2" data-to="3" d="M 390,260 H 296" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="3" data-to="4" d="M 160,316 V 378" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="0" data-x="160" data-y="80" data-width="260" data-height="112"><rect x="30.0" y="24.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="56" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Evaluate</text><text x="160" y="80" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">return quality and</text><text x="160" y="104" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">boundary</text></g><g data-node="1" data-x="520" data-y="80" data-width="260" data-height="112"><rect x="390.0" y="24.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="68" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Group</text><text x="520" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">independent trust domains</text></g><g data-node="2" data-x="520" data-y="260" data-width="260" data-height="112"><rect x="390.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Compare</text><text x="520" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">structured claims</text></g><g data-node="3" data-x="160" data-y="260" data-width="260" data-height="112"><rect x="30.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Report</text><text x="160" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">agreement and divergence</text></g><g data-node="4" data-x="160" data-y="440" data-width="260" data-height="112"><rect x="30.0" y="384.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="428" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Decide</text><text x="160" y="452" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">architect adjudication</text></g>
</svg>
