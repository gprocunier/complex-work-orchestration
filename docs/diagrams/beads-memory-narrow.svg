<svg xmlns="http://www.w3.org/2000/svg" width="320" height="450" viewBox="0 0 320 450" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">What persists between sessions</title>
  <desc id="desc">Session A saves project files and tests alongside task decisions. A fresh Session B reads both and verifies them before continuing; an unrecorded conversation is not part of that durable state. The two branches show saved information, not concurrent workers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a60000"/></marker></defs>
  <path data-from="session-a" data-to="files" d="M 160,100 V 130 H 80 V 159" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="session-a" data-to="tasks" d="M 160,100 V 130 H 240 V 159" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="files" data-to="session-b" d="M 80,275 V 310 H 160 V 344" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="tasks" data-to="session-b" d="M 240,275 V 310 H 160 V 344" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="session-a" data-x="160" data-y="60" data-width="240" data-height="80"><rect x="40.0" y="20.0" width="240" height="80" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="48" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Session A</text><text x="160" y="72" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">save checked work</text></g><g data-node="files" data-x="80" data-y="220" data-width="136" data-height="110"><rect x="12.0" y="165.0" width="136" height="110" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="80" y="208" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Files</text><text x="80" y="232" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and tests</text></g><g data-node="tasks" data-x="240" data-y="220" data-width="136" data-height="110"><rect x="172.0" y="165.0" width="136" height="110" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="240" y="208" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Tasks</text><text x="240" y="232" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">decisions</text></g><g data-node="session-b" data-x="160" data-y="390" data-width="240" data-height="80"><rect x="40.0" y="350.0" width="240" height="80" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="378" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Session B</text><text x="160" y="402" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">verify, then continue</text></g>
</svg>
