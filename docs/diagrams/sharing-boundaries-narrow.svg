<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1220" viewBox="0 0 360 1220" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Where project context can go</title>
  <desc id="desc">Illustrative sharing map—not a network trace or enforcement guarantee. Local files and Beads can supply context to an agent client. That client may send selected context to its configured provider. An additional reviewer requires separate opt-in and only the approved material; a redacted brief is one explicitly chosen boundary. A local/private endpoint is a separately approved route, not proof that the cloud session is offline.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="records" data-to="client" d="M 180,180 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="client" data-to="provider" d="M 180,420 V 514" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="client" data-to="outside" d="M 320,340 H 344 V 860 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="client" data-to="local" d="M 40,340 H 16 V 1120 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="records" data-x="180" data-y="100" data-width="280" data-height="160"><rect x="40.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Project files + Beads</text><text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Saved locally</text><text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Not automatically private</text></g><g data-node="client" data-x="180" data-y="340" data-width="280" data-height="160"><rect x="40.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="316" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Agent client + tools</text><text x="180" y="340" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Permissions control access</text><text x="180" y="364" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Selected context may leave</text></g><g data-node="provider" data-x="180" data-y="600" data-width="280" data-height="160"><rect x="40.0" y="520.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="576" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Configured provider</text><text x="180" y="600" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Ordinary agent context</text><text x="180" y="624" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check provider handling</text></g><g data-node="outside" data-x="180" data-y="860" data-width="280" data-height="160"><rect x="40.0" y="780.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="836" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Additional reviewer</text><text x="180" y="860" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Extra opt-in required</text><text x="180" y="884" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only approved material</text></g><g data-node="local" data-x="180" data-y="1120" data-width="280" data-height="160"><rect x="40.0" y="1040.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1096" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Local/private endpoint</text><text x="180" y="1120" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Separate opt-in + checks</text><text x="180" y="1144" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Not an offline guarantee</text></g>
</svg>
