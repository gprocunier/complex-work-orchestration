<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="960" viewBox="0 0 1020 960" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">From an approved local question to a checked answer</title>
  <desc id="desc">Illustrative procedure—not a new endpoint run. Preparation makes no model call. Apply the selected profile’s checks before the one approved execution. Retain actual dispatch JSON, check response usability and compare the same attempt’s workspace. Arrows show procedure, not a replacement of the evaluator’s original inputs. Failed checks, an unusable answer or unexpected file changes require investigation.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="question" data-to="prepare" d="M 310,100 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="prepare" data-to="checks" d="M 650,100 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="checks" data-to="call" d="M 850,180 V 264" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="call" data-to="answer" d="M 710,350 H 656" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="answer" data-to="mutation" d="M 370,350 H 316" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="mutation" data-to="normalize" d="M 170,430 V 514" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="normalize" data-to="evaluate" d="M 310,600 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evaluate" data-to="lead" d="M 650,600 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="checks" data-to="stop" d="M 990,100 H 1008 V 860 H 656" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="answer" data-to="stop" d="M 510,430 V 475 H 1008 V 860 H 656" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="mutation" data-to="stop" d="M 30,350 H 14 V 860 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="question" data-x="170" data-y="100" data-width="280" data-height="160"><rect x="30.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="52" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Approve question +</text><text x="170" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">route</text><text x="170" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Allowed material +</text><text x="170" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">endpoint</text><text x="170" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Explicit local opt-in</text></g><g data-node="prepare" data-x="510" data-y="100" data-width="280" data-height="160"><rect x="370.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Prepare the request</text><text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Inspect profile + envelope</text><text x="510" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No model call</text></g><g data-node="checks" data-x="850" data-y="100" data-width="280" data-height="160"><rect x="710.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="64" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check before execution</text><text x="850" y="88" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Apply this profile’s</text><text x="850" y="112" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">checks</text><text x="850" y="136" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Proceed only if they pass</text></g><g data-node="call" data-x="850" data-y="350" data-width="280" data-height="160"><rect x="710.0" y="270.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="326" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Make one approved call</text><text x="850" y="350" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Save actual dispatch JSON</text><text x="850" y="374" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Not just prepared input</text></g><g data-node="answer" data-x="510" data-y="350" data-width="280" data-height="160"><rect x="370.0" y="270.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="314" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check response</text><text x="510" y="338" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">usability</text><text x="510" y="362" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep the raw answer</text><text x="510" y="386" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unusable is not success</text></g><g data-node="mutation" data-x="170" data-y="350" data-width="280" data-height="160"><rect x="30.0" y="270.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="314" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Compare the workspace</text><text x="170" y="338" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Same attempt + saved</text><text x="170" y="362" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">report</text><text x="170" y="386" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Inspect unexpected changes</text></g><g data-node="normalize" data-x="170" data-y="600" data-width="280" data-height="160"><rect x="30.0" y="520.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="552" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Package the answer</text><text x="170" y="576" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Raw answer + mutation</text><text x="170" y="600" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">report</text><text x="170" y="624" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Bundle is not evaluator</text><text x="170" y="648" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">input</text></g><g data-node="evaluate" data-x="510" data-y="600" data-width="280" data-height="160"><rect x="370.0" y="520.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="564" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Evaluate original</text><text x="510" y="588" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">records</text><text x="510" y="612" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Raw answer + dispatch JSON</text><text x="510" y="636" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Matching mutation report</text></g><g data-node="lead" data-x="850" data-y="600" data-width="280" data-height="160"><rect x="710.0" y="520.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="564" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Lead records decision</text><text x="850" y="588" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence + required</text><text x="850" y="612" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">reviews</text><text x="850" y="636" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only within granted scope</text></g><g data-node="stop" data-x="510" data-y="860" data-width="280" data-height="160"><rect x="370.0" y="780.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="824" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Stop and investigate</text><text x="510" y="848" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Failed check, unusable</text><text x="510" y="872" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">reply</text><text x="510" y="896" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">or unexpected mutation</text></g>
</svg>
