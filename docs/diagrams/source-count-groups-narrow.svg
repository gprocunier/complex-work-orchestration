<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1400" viewBox="0 0 360 1400" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Count source groups, not model names</title>
  <desc id="desc">Illustrative source accounting, not measured statistical independence or a provider ranking. Two eligible models from provider A count as one group; eligible local/OpenShift aliases share a default group. Only known, bound, eligible primary inputs count. When required, enough groups allow the explicitly invoked claim comparison—not a truth verdict or permission to act. Exact exclusions and metadata precedence remain below.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="input" data-to="cloud" d="M 180,180 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="input" data-to="local" d="M 40,100 H 16 V 580 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="input" data-to="excluded" d="M 320,100 H 344 V 1300 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="cloud" data-to="count" d="M 320,340 H 332 V 700 H 220 V 734" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="local" data-to="count" d="M 180,660 V 734" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="count" data-to="compare" d="M 180,900 V 974" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="input" data-x="180" data-y="100" data-width="280" data-height="160"><rect x="40.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check each input first</text><text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Use evaluated records</text><text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Not model-name counting</text></g><g data-node="cloud" data-x="180" data-y="340" data-width="280" data-height="160"><rect x="40.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="316" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Provider A · one group</text><text x="180" y="340" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Two eligible model reviews</text><text x="180" y="364" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">do not add a second group</text></g><g data-node="local" data-x="180" data-y="580" data-width="280" data-height="160"><rect x="40.0" y="500.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="544" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Local aliases · one</text><text x="180" y="568" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">group</text><text x="180" y="592" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Eligible local/OpenShift</text><text x="180" y="616" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">names share default group</text></g><g data-node="count" data-x="180" data-y="820" data-width="280" data-height="160"><rect x="40.0" y="740.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="796" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Count eligible groups</text><text x="180" y="820" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Checked eligible records</text><text x="180" y="844" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Default minimum: two</text></g><g data-node="compare" data-x="180" data-y="1060" data-width="280" data-height="160"><rect x="40.0" y="980.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1024" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Invoke claim</text><text x="180" y="1048" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">comparison</text><text x="180" y="1072" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only with required inputs</text><text x="180" y="1096" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Agreement is not truth</text></g><g data-node="excluded" data-x="180" data-y="1300" data-width="280" data-height="160"><rect x="40.0" y="1220.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1276" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Do not count these</text><text x="180" y="1300" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unknown / conflicting data</text><text x="180" y="1324" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unbound, held, non-primary</text></g>
</svg>
