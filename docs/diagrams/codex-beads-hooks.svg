<svg xmlns="http://www.w3.org/2000/svg" width="680" height="980" viewBox="0 0 680 980" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">Hook display decision</title>
  <desc id="desc">When SessionStart context is visible, inspect the installed Codex build. If the stable display hint is supported, quiet display is available; otherwise retain full-context display. Both paths preserve Beads additionalContext. Unsupported quiet mode fails closed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a60000"/></marker></defs>
  <path data-from="symptom" data-to="inspect" d="M 340,136 V 198" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="inspect" data-to="support" d="M 340,316 V 384" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="support" data-to="quiet" d="M 220,460 H 160 V 618" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="154" y="550" text-anchor="middle" font-size="18" font-weight="600" fill="#760000" stroke="#fff" stroke-width="5" paint-order="stroke">Yes</text><path data-from="support" data-to="full" d="M 460,460 H 520 V 618" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="545" y="550" text-anchor="middle" font-size="18" font-weight="600" fill="#760000" stroke="#fff" stroke-width="5" paint-order="stroke">No</text><path data-from="quiet" data-to="preserve" d="M 160,736 V 790 H 340 V 838" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="full" data-to="preserve" d="M 520,736 V 790 H 340 V 838" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="symptom" data-x="340" data-y="80" data-width="260" data-height="112"><rect x="210.0" y="24.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Visible context</text><text x="340" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">SessionStart output</text></g><g data-node="inspect" data-x="340" data-y="260" data-width="260" data-height="112"><rect x="210.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Inspect support</text><text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">installed Codex build</text></g><g data-node="support" data-x="340" data-y="460" data-width="240" data-height="140"><polygon points="340,390.0 460.0,460 340,530.0 220.0,460" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="340" y="448" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Display hint</text><text x="340" y="472" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">supported?</text></g><g data-node="quiet" data-x="160" data-y="680" data-width="260" data-height="112"><rect x="30.0" y="624.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="668" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Quiet display</text><text x="160" y="692" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">presentation hint only</text></g><g data-node="full" data-x="520" data-y="680" data-width="260" data-height="112"><rect x="390.0" y="624.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="656" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Full-context display</text><text x="520" y="680" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">unsupported quiet fails</text><text x="520" y="704" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">closed</text></g><g data-node="preserve" data-x="340" data-y="900" data-width="260" data-height="112"><rect x="210.0" y="844.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="340" y="888" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Preserve memory</text><text x="340" y="912" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Beads additionalContext</text></g>
</svg>
