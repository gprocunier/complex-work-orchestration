<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1230" viewBox="0 0 1020 1230" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Verify context delivery before hiding its display</title>
  <desc id="desc">Illustrative configuration decision—not a new hook installation or delivery test. Inspect the installed client. Unsupported quiet mode is rejected; keep full-context display. Supported quiet configuration retains the Beads command and adds only a presentation hint. Before adopting it, obtain host-observed evidence that the full context still reaches the model. Missing or failed evidence keeps the full-context fallback while you investigate; character count alone is not proof.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="inspect" data-to="support" d="M 510,180 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="support" data-to="quiet" d="M 370,350 H 170 V 524" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="support" data-to="full" d="M 650,350 H 850 V 524" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="quiet" data-to="delivery" d="M 170,690 V 784" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="delivery" data-to="adopt" d="M 170,950 V 1044" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="delivery" data-to="fallback" d="M 310,870 H 850 V 1044" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="inspect" data-x="510" data-y="100" data-width="280" data-height="160"><rect x="370.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="52" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Inspect the installed</text><text x="510" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">client</text><text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Preview configuration</text><text x="510" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">first</text><text x="510" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not suppress context</text></g><g data-node="support" data-x="510" data-y="350" data-width="280" data-height="180"><polygon points="510,260.0 650.0,350 510,440.0 370.0,350" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="510" y="338" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Display hint?</text><text x="510" y="362" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Supported here?</text></g><g data-node="quiet" data-x="170" data-y="610" data-width="280" data-height="160"><rect x="30.0" y="530.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="574" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If supported · quiet</text><text x="170" y="598" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">option</text><text x="170" y="622" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep Beads command intact</text><text x="170" y="646" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Add presentation hint only</text></g><g data-node="full" data-x="850" data-y="610" data-width="280" data-height="160"><rect x="710.0" y="530.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="574" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If unsupported · full</text><text x="850" y="598" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">text</text><text x="850" y="622" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Quiet attempt is rejected</text><text x="850" y="646" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep full-context display</text></g><g data-node="delivery" data-x="170" data-y="870" data-width="280" data-height="160"><rect x="30.0" y="790.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="834" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Verify actual delivery</text><text x="170" y="858" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Host observes full context</text><text x="170" y="882" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Character count is not</text><text x="170" y="906" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">proof</text></g><g data-node="adopt" data-x="170" data-y="1130" data-width="280" data-height="160"><rect x="30.0" y="1050.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="1094" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Adopt only after proof</text><text x="170" y="1118" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Full context still</text><text x="170" y="1142" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">delivered</text><text x="170" y="1166" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check relevant lifecycle</text></g><g data-node="fallback" data-x="850" data-y="1130" data-width="280" data-height="160"><rect x="710.0" y="1050.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="1082" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If proof is missing or</text><text x="850" y="1106" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">fails</text><text x="850" y="1130" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep full-context display</text><text x="850" y="1154" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Investigate before</text><text x="850" y="1178" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">adoption</text></g>
</svg>
