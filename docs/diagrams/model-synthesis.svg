  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="plan" data-to="review-a" d="M 510,180 V 220 H 170 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="plan" data-to="review-b" d="M 510,180 V 220 H 850 V 254" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="review-a" data-to="evaluated-a" d="M 170,420 V 494" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="review-b" data-to="evaluated-b" d="M 850,420 V 494" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evaluated-a" data-to="compare" d="M 170,660 V 700 H 470 V 734" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evaluated-b" data-to="compare" d="M 850,660 V 700 H 550 V 734" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="compare" data-to="decision" d="M 510,900 V 974" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="plan" data-x="510" data-y="100" data-width="280" data-height="160"><rect x="370.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Lead prepares the plan</text><text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Scope + review questions</text><text x="510" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Approved material only</text></g><g data-node="review-a" data-x="170" data-y="340" data-width="280" data-height="160"><rect x="30.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="304" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Reviewer A</text><text x="170" y="328" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Separate bounded</text><text x="170" y="352" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">assignment</text><text x="170" y="376" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its original answer</text></g><g data-node="evaluated-a" data-x="170" data-y="580" data-width="280" data-height="160"><rect x="30.0" y="500.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="556" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check A’s return</text><text x="170" y="580" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence, scope + holds</text><text x="170" y="604" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its evaluation</text></g><g data-node="review-b" data-x="850" data-y="340" data-width="280" data-height="160"><rect x="710.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="304" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Reviewer B</text><text x="850" y="328" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Separate bounded</text><text x="850" y="352" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">assignment</text><text x="850" y="376" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its original answer</text></g><g data-node="evaluated-b" data-x="850" data-y="580" data-width="280" data-height="160"><rect x="710.0" y="500.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="556" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check B’s return</text><text x="850" y="580" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence, scope + holds</text><text x="850" y="604" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its evaluation</text></g><g data-node="compare" data-x="510" data-y="820" data-width="280" data-height="160"><rect x="370.0" y="740.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="784" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Compare eligible</text><text x="510" y="808" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">findings</text><text x="510" y="832" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Agreement + disagreement</text><text x="510" y="856" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep excluded inputs apart</text></g><g data-node="decision" data-x="510" data-y="1060" data-width="280" data-height="160"><rect x="370.0" y="980.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="1024" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">One lead decides</text><text x="510" y="1048" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Resolve material</text><text x="510" y="1072" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">differences</text><text x="510" y="1096" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Record what changes + why</text></g>
</svg>
