  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <line x1="42" y1="615" x2="318" y2="615" stroke="#6a6e73" stroke-width="1.5" stroke-dasharray="7 7"/><text x="100" y="644" text-anchor="middle" font-size="15" font-weight="600">New conversation</text><text x="205" y="1060" text-anchor="middle" font-size="18" font-weight="600">Yes</text><text x="316" y="1050" text-anchor="middle" font-size="18" font-weight="600">No</text><g data-node="session-one" data-x="180" data-y="90" data-width="280" data-height="128"><rect x="40.0" y="26.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="51" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Session 1 · fix</text><text x="180" y="77" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">validator</text><text x="180" y="103" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Booleans are not ports</text><text x="180" y="129" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep list-of-errors API</text></g><g data-node="beads" data-x="180" data-y="290" data-width="280" data-height="128"><path d="M 40.0,240.0 C 40.0,221.0 320.0,221.0 320.0,240.0 V 340.0 C 320.0,359.0 40.0,359.0 40.0,340.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 40.0,240.0 C 40.0,259.0 320.0,259.0 320.0,240.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="180" y="273" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Beads task records</text><text x="180" y="299" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Validator accepted</text><text x="180" y="325" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Dependent CLI still waiting</text></g><g data-node="files" data-x="180" data-y="490" data-width="280" data-height="128"><path d="M 40.0,440.0 C 40.0,421.0 320.0,421.0 320.0,440.0 V 540.0 C 320.0,559.0 40.0,559.0 40.0,540.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 40.0,440.0 C 40.0,459.0 320.0,459.0 320.0,440.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="180" y="473" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Project files</text><text x="180" y="499" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Code + tests</text><text x="180" y="525" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">HANDOFF.md + evidence</text></g><g data-node="session-two" data-x="180" data-y="750" data-width="280" data-height="128"><rect x="40.0" y="686.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="724" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Session 2 · start fresh</text><text x="180" y="750" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Read both saved records</text><text x="180" y="776" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check current code + tests</text></g><g data-node="acceptance" data-x="180" data-y="950" data-width="280" data-height="140"><polygon points="180,880.0 320.0,950 180,1020.0 40.0,950" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="180" y="937" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600">Acceptance verified?</text><text x="180" y="963" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Current evidence?</text></g><g data-node="cli" data-x="180" data-y="1170" data-width="280" data-height="128"><rect x="40.0" y="1106.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1144" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Add the CLI</text><text x="180" y="1170" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Preserve accepted behavior</text><text x="180" y="1196" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Then test the new command</text></g><g data-node="investigate" data-x="180" data-y="1370" data-width="280" data-height="128"><rect x="40.0" y="1306.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1344" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Investigate first</text><text x="180" y="1370" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Missing or stale evidence</text><text x="180" y="1396" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not start the CLI yet</text></g><path data-from="session-one" data-to="beads" d="M 180,154 V 220" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="session-one" data-to="files" d="M 326,90 H 344 V 490 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="beads" data-to="session-two" d="M 34,290 H 16 V 750 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="files" data-to="session-two" d="M 180,554 V 680" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="session-two" data-to="acceptance" d="M 180,814 V 874" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="acceptance" data-to="cli" d="M 180,1020 V 1100" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="acceptance" data-to="investigate" d="M 326,950 H 344 V 1370 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
