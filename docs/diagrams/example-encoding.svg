<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="900" viewBox="0 0 1020 900" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">The test missed the process-output boundary</title>
  <desc id="desc">Recorded local CLI maintenance. A missing café.md diagnostic fits an in-memory Unicode text stream, but unescaped JSON fails at a real process’s ASCII stdout boundary. Default JSON escaping makes the transport ASCII-safe; decoding restores the original filename. The added subprocess regression checks the actual process under forced ASCII, including status and decoded text. This depicts the historical finding and correction, not a new agent run.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <text x="510" y="755" text-anchor="middle" font-size="18" font-weight="600">Verifies</text><g data-node="input" data-x="510" data-y="90" data-width="280" data-height="128"><rect x="370.0" y="26.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="77" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Missing link: café.md</text><text x="510" y="103" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Diagnostic contains é</text></g><g data-node="memory" data-x="270" data-y="320" data-width="280" data-height="128"><rect x="130.0" y="256.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="270" y="294" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">In-memory text stream</text><text x="270" y="320" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unescaped JSON is accepted</text><text x="270" y="346" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No ASCII encoder tested</text></g><g data-node="process" data-x="750" data-y="320" data-width="280" data-height="128"><rect x="610.0" y="256.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="750" y="294" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Real process · ASCII</text><text x="750" y="320" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unescaped JSON fails</text><text x="750" y="346" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">UnicodeEncodeError</text></g><g data-node="escape" data-x="750" data-y="550" data-width="280" data-height="128"><rect x="610.0" y="486.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="750" y="524" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Correct JSON escaping</text><text x="750" y="550" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Transport uses \u00e9</text><text x="750" y="576" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">ASCII stdout can emit it</text></g><g data-node="test" data-x="270" data-y="780" data-width="280" data-height="128"><rect x="130.0" y="716.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="270" y="754" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Added subprocess test</text><text x="270" y="780" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Force ASCII stdout</text><text x="270" y="806" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check status + decoded text</text></g><g data-node="consumer" data-x="750" data-y="780" data-width="280" data-height="128"><rect x="610.0" y="716.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="750" y="754" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Consumer decodes JSON</text><text x="750" y="780" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Original café.md preserved</text><text x="750" y="806" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No diagnostic text is lost</text></g><path data-from="input" data-to="memory" d="M 510,154 V 205 H 270 V 250" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="input" data-to="process" d="M 510,154 V 205 H 750 V 250" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="process" data-to="escape" d="M 750,384 V 480" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="escape" data-to="consumer" d="M 750,614 V 710" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="test" data-to="consumer" d="M 410,780 H 604" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
