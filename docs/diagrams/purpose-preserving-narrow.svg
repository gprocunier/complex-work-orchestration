<svg xmlns="http://www.w3.org/2000/svg" width="320" height="550" viewBox="0 0 320 550" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">Check the result against the agreed requirements</title>
  <desc id="desc">Set requirements and permissions before build and review. Check each finding against its evidence. The lead accepts work that meets the requirements and keeps unanswered questions open. The lead decides within your granted authority; decisions outside it remain yours. Illustrative workflow, not an observed concurrent execution trace.</desc>
