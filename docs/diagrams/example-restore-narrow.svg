t-baseline="central" font-size="18" font-weight="400">The fixture sets False</text><text x="180" y="746" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No service is contacted</text></g><g data-node="restore" data-x="180" data-y="930" data-width="280" data-height="128"><rect x="40.0" y="866.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="904" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Restore previous values</text><text x="180" y="930" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Serialize the saved object</text><text x="180" y="956" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write active.json again</text></g><g data-node="verify" data-x="180" data-y="1140" data-width="280" data-height="128"><rect x="40.0" y="1076.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1114" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Read back and compare</text><text x="180" y="1140" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Parsed JSON equals saved</text><text x="180" y="1166" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Port is 8080 again</text></g><path data-from="previous" data-to="stage" d="M 180,154 V 230" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="stage" data-to="active" d="M 180,364 V 440" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="active" data-to="health" d="M 180,574 V 650" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="health" data-to="restore" d="M 180,784 V 860" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="previous" data-to="restore" d="M 34,90 H 16 V 930 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="restore" data-to="verify" d="M 180,994 V 1070" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
