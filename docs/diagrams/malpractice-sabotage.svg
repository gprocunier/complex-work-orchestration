<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">Return safety gate</title>
  <desc id="desc">Check the return against its packet and mutation boundary, score malpractice and sabotage signals, and record an accepted, rejected, or quarantined disposition. The architect decides whether a finding may change the plan.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a60000"/></marker></defs>
  <path data-from="0" data-to="1" d="M 290,80 H 384" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="1" data-to="2" d="M 520,136 V 198" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="2" data-to="3" d="M 390,260 H 296" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="3" data-to="4" d="M 160,316 V 378" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="0" data-x="160" data-y="80" data-width="260" data-height="112"><rect x="30.0" y="24.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="68" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Return</text><text x="160" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">model output</text></g><g data-node="1" data-x="520" data-y="80" data-width="260" data-height="112"><rect x="390.0" y="24.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="56" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Boundary</text><text x="520" y="80" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">packet and mutation</text><text x="520" y="104" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">checks</text></g><g data-node="2" data-x="520" data-y="260" data-width="260" data-height="112"><rect x="390.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Score</text><text x="520" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">malpractice and sabotage</text></g><g data-node="3" data-x="160" data-y="260" data-width="260" data-height="112"><rect x="30.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="236" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Disposition</text><text x="160" y="260" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">accept, reject, or</text><text x="160" y="284" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">quarantine</text></g><g data-node="4" data-x="160" data-y="440" data-width="260" data-height="112"><rect x="30.0" y="384.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="428" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Decision</text><text x="160" y="452" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">architect adjudication</text></g>
</svg>
