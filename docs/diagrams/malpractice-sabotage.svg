<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="970" viewBox="0 0 1020 970" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">A usable answer can still need review</title>
  <desc id="desc">Illustrative evaluation map. Evidence disposition and required process/peer-review status are separate results, not successive or mutually exclusive verdicts. A usable answer can still be held from implementation pending review. Unsafe or boundary-unresolved evidence stays isolated with broader reuse restrictions. Honest disclosure of provider limits is not automatic rejection.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="return" data-to="evidence" d="M 510,180 V 225 H 170 V 264" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="return" data-to="review" d="M 510,180 V 225 H 850 V 264" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evidence" data-to="both" d="M 170,430 V 485 H 470 V 524" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="review" data-to="both" d="M 850,430 V 485 H 550 V 524" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="evidence" data-to="isolated" d="M 30,350 H 14 V 740 H 170 V 784" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="both" data-to="decision" d="M 510,690 V 784" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="return" data-x="510" data-y="100" data-width="280" data-height="160"><rect x="370.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="52" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check the returned</text><text x="510" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">answer</text><text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence + allowed actions</text><text x="510" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Two separate results</text><text x="510" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">follow</text></g><g data-node="evidence" data-x="170" data-y="350" data-width="280" data-height="160"><rect x="30.0" y="270.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="302" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">1 · Evidence</text><text x="170" y="326" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">disposition</text><text x="170" y="350" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Usable, rejected or</text><text x="170" y="374" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">isolated</text><text x="170" y="398" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Record reasons + risks</text></g><g data-node="review" data-x="850" data-y="350" data-width="280" data-height="160"><rect x="710.0" y="270.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="314" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">2 · Required review</text><text x="850" y="338" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">status</text><text x="850" y="362" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Process / peer review</text><text x="850" y="386" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Pending or complete</text></g><g data-node="both" data-x="510" data-y="610" data-width="280" data-height="160"><rect x="370.0" y="530.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="562" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Lead checks both</text><text x="510" y="586" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">results</text><text x="510" y="610" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Usable does not mean ready</text><text x="510" y="634" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Required review must</text><text x="510" y="658" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">finish</text></g><g data-node="isolated" data-x="170" data-y="870" data-width="280" data-height="160"><rect x="30.0" y="790.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="822" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Keep unsafe evidence</text><text x="170" y="846" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">apart</text><text x="170" y="870" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Resolve boundaries first</text><text x="170" y="894" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Broader reuse is</text><text x="170" y="918" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">restricted</text></g><g data-node="decision" data-x="510" data-y="870" data-width="280" data-height="160"><rect x="370.0" y="790.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="822" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Record permitted</text><text x="510" y="846" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">changes</text><text x="510" y="870" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check evidence + authority</text><text x="510" y="894" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not implement held</text><text x="510" y="918" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">advice</text></g>
</svg>
