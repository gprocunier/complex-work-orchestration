<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2080" viewBox="0 0 360 2080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Which tasks must wait after an attempt fails</title>
  <desc id="desc">Illustrative task graph—not an observed incident or concurrent execution trace. The ended attempt on A stays ended. B waits for accepted A. C does not need A’s result but must pass its own permission, prerequisite, safety and shared-capacity checks. A replacement of A requires a distinct newly authorized attempt with a fresh allowance. A CONTAINED label alone does not establish cleanup.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="ended" data-to="inspect" d="M 180,180 V 234" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="inspect" data-to="replacement" d="M 180,400 V 454" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="replacement" data-to="accepted" d="M 180,620 V 674" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="ended" data-to="waiting" d="M 320,100 H 344 V 1020 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="accepted" data-to="dependent" d="M 40,760 H 16 V 1240 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="waiting" data-to="dependent" d="M 180,1100 V 1154" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="independent" data-to="checks" d="M 180,1620 V 1674" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="checks" data-to="continue" d="M 180,1840 V 1894" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="ended" data-x="180" data-y="100" data-width="280" data-height="160"><rect x="40.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task A · attempt ended</text><text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep its failure evidence</text><text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not resume this attempt</text></g><g data-node="inspect" data-x="180" data-y="320" data-width="280" data-height="160"><rect x="40.0" y="240.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="272" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Inspect what happened</text><text x="180" y="296" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Stop, resources, files,</text><text x="180" y="320" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">use</text><text x="180" y="344" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep failed / UNKNOWN</text><text x="180" y="368" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">facts</text></g><g data-node="replacement" data-x="180" data-y="540" data-width="280" data-height="160"><rect x="40.0" y="460.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="516" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">A distinct replacement</text><text x="180" y="540" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only with new permission</text><text x="180" y="564" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and a fresh allowance</text></g><g data-node="accepted" data-x="180" data-y="760" data-width="280" data-height="160"><rect x="40.0" y="680.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="736" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task A accepted?</text><text x="180" y="760" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Verify the replacement</text><text x="180" y="784" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not assume acceptance</text></g><g data-node="waiting" data-x="180" data-y="1020" data-width="280" data-height="160"><rect x="40.0" y="940.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="996" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task B · must wait</text><text x="180" y="1020" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Depends on accepted A</text><text x="180" y="1044" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Failure is not acceptance</text></g><g data-node="dependent" data-x="180" data-y="1240" data-width="280" data-height="160"><rect x="40.0" y="1160.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1204" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task B · may proceed</text><text x="180" y="1228" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only after A is accepted</text><text x="180" y="1252" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and B passes its own</text><text x="180" y="1276" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">checks</text></g><g data-node="independent" data-x="180" data-y="1540" data-width="280" data-height="160"><rect x="40.0" y="1460.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1516" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task C · independent</text><text x="180" y="1540" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Does not need A’s result</text><text x="180" y="1564" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Still check stop scope</text></g><g data-node="checks" data-x="180" data-y="1760" data-width="280" data-height="160"><rect x="40.0" y="1680.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1736" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check C’s own limits</text><text x="180" y="1760" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Permission + prerequisites</text><text x="180" y="1784" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Safety + shared capacity</text></g><g data-node="continue" data-x="180" data-y="1980" data-width="280" data-height="160"><rect x="40.0" y="1900.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1956" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Task C · may proceed</text><text x="180" y="1980" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only if its checks pass</text><text x="180" y="2004" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No automatic parent stop</text></g>
</svg>
