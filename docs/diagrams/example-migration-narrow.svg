<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1510" viewBox="0 0 360 1510" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Compare converters without changing the requirements</title>
  <desc id="desc">Proposed demonstration — not executed. Save cases, compatibility requirements, scoring and the selection rule. Explicitly invoke the check before both converters use the same baseline. A runner repair must preserve that baseline and be rechecked. Changed cases or rules must not continue the old evaluation; intentionally revised requirements start a separate evaluation while preserving the original evidence. The comparison may find that neither converter qualifies. Existing component regressions are not this integrated converter comparison.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <text x="247" y="202" text-anchor="middle" font-size="17" font-weight="600">Optional</text><text x="214" y="653" text-anchor="middle" font-size="18" font-weight="600">Yes</text><text x="75" y="626" text-anchor="middle" font-size="18" font-weight="600">No</text><text x="180" y="1320" text-anchor="middle" font-size="15" font-weight="600">Changed cases or rules → new evaluation</text><g data-node="baseline" data-x="180" data-y="90" data-width="280" data-height="128"><path d="M 40.0,40.0 C 40.0,21.0 320.0,21.0 320.0,40.0 V 140.0 C 320.0,159.0 40.0,159.0 40.0,140.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 40.0,40.0 C 40.0,59.0 320.0,59.0 320.0,40.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="180" y="73" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Save one baseline</text><text x="180" y="99" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Cases + compatibility</text><text x="180" y="125" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Scoring + selection rule</text></g><g data-node="repair" data-x="180" data-y="300" data-width="280" data-height="128"><rect x="40.0" y="236.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="274" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Repair the runner only</text><text x="180" y="300" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep the saved baseline</text><text x="180" y="326" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Recheck before execution</text></g><g data-node="check" data-x="180" data-y="530" data-width="280" data-height="140"><polygon points="180,460.0 320.0,530 180,600.0 40.0,530" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="180" y="517" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600">Same saved rules?</text><text x="180" y="543" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Invoke the check</text></g><g data-node="converter-a" data-x="180" data-y="760" data-width="280" data-height="128"><rect x="40.0" y="696.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="734" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Converter A</text><text x="180" y="760" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Use the same cases</text><text x="180" y="786" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and the same rules</text></g><g data-node="converter-b" data-x="180" data-y="970" data-width="280" data-height="128"><rect x="40.0" y="906.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="944" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Converter B</text><text x="180" y="970" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Use the same cases</text><text x="180" y="996" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and the same rules</text></g><g data-node="report" data-x="180" data-y="1190" data-width="280" data-height="128"><rect x="40.0" y="1126.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1164" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Compare the results</text><text x="180" y="1190" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Apply the saved rule</text><text x="180" y="1216" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Neither may qualify</text></g><g data-node="separate" data-x="180" data-y="1420" data-width="280" data-height="128"><rect x="40.0" y="1356.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1394" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Separate evaluation</text><text x="180" y="1420" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not continue old run</text><text x="180" y="1446" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep its original evidence</text></g><path data-from="baseline" data-to="repair" d="M 180,154 V 230" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="baseline" data-to="check" d="M 34,90 H 16 V 530 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="repair" data-to="check" d="M 180,364 V 454" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="converter-a" d="M 180,600 V 690" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="converter-b" d="M 326,530 H 344 V 970 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="converter-a" data-to="report" d="M 34,760 H 16 V 1190 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="converter-b" data-to="report" d="M 180,1034 V 1120" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="separate" d="M 180,600 V 640 H 4 V 1420 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
