<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1640" viewBox="0 0 360 1640" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Separate reviews, one recorded decision</title>
  <desc id="desc">Illustrative planning workflow—not a concurrency trace. Assign reviewers separate bounded questions and retain each original return and evaluation. Compare eligible findings while preserving held or excluded inputs separately. The lead records one decision; neither agreement nor a review grants implementation authority. Branches do not prove statistical independence or simultaneous execution.</desc>
