ominant-baseline="central" font-size="20" font-weight="600">Reviewer A</text><text x="180" y="328" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Separate bounded</text><text x="180" y="352" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">assignment</text><text x="180" y="376" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its original answer</text></g><g data-node="evaluated-a" data-x="180" data-y="580" data-width="280" data-height="160"><rect x="40.0" y="500.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="556" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check A’s return</text><text x="180" y="580" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence, scope + holds</text><text x="180" y="604" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its evaluation</text></g><g data-node="review-b" data-x="180" data-y="820" data-width="280" data-height="160"><rect x="40.0" y="740.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="784" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Reviewer B</text><text x="180" y="808" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Separate bounded</text><text x="180" y="832" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">assignment</text><text x="180" y="856" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its original answer</text></g><g data-node="evaluated-b" data-x="180" data-y="1060" data-width="280" data-height="160"><rect x="40.0" y="980.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1036" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check B’s return</text><text x="180" y="1060" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Evidence, scope + holds</text><text x="180" y="1084" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Retain its evaluation</text></g><g data-node="compare" data-x="180" data-y="1300" data-width="280" data-height="160"><rect x="40.0" y="1220.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1264" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Compare eligible</text><text x="180" y="1288" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">findings</text><text x="180" y="1312" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Agreement + disagreement</text><text x="180" y="1336" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep excluded inputs apart</text></g><g data-node="decision" data-x="180" data-y="1540" data-width="280" data-height="160"><rect x="40.0" y="1460.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1504" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">One lead decides</text><text x="180" y="1528" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Resolve material</text><text x="180" y="1552" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">differences</text><text x="180" y="1576" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Record what changes + why</text></g>
</svg>
