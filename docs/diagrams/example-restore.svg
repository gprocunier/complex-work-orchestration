<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="740" viewBox="0 0 1020 740" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Restore configuration and check the result</title>
  <desc id="desc">Scripted temporary-local-file exercise — intentionally simulated health failure. Previous values, including port 8080, stay in a Python object in memory, not a durable backup file. The fixture stages port 8081, writes active.json, then forces a false health result. It serializes the saved values back, rereads the file and compares parsed JSON content. This does not establish byte-exact recovery or real service health; temporary files are cleaned up when the exercise ends.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <text x="340" y="420" text-anchor="middle" font-size="18" font-weight="600">Use saved values</text><g data-node="previous" data-x="170" data-y="190" data-width="280" data-height="128"><rect x="30.0" y="126.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="164" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Previous values · 8080</text><text x="170" y="190" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Saved in a Python object</text><text x="170" y="216" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Not a backup file</text></g><g data-node="stage" data-x="510" data-y="90" data-width="280" data-height="128"><rect x="370.0" y="26.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="77" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Stage candidate · 8081</text><text x="510" y="103" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write staged.json</text></g><g data-node="active" data-x="850" data-y="190" data-width="280" data-height="128"><rect x="710.0" y="126.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="164" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Apply candidate · 8081</text><text x="850" y="190" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write active.json</text><text x="850" y="216" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Temporary local file only</text></g><g data-node="health" data-x="850" data-y="440" data-width="280" data-height="128"><rect x="710.0" y="376.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="414" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Simulated health fails</text><text x="850" y="440" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">The fixture sets False</text><text x="850" y="466" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No service is contacted</text></g><g data-node="restore" data-x="510" data-y="640" data-width="280" data-height="128"><rect x="370.0" y="576.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="614" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Restore previous values</text><text x="510" y="640" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Serialize the saved object</text><text x="510" y="666" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write active.json again</text></g><g data-node="verify" data-x="170" data-y="640" data-width="280" data-height="128"><rect x="30.0" y="576.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="614" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Read back and compare</text><text x="170" y="640" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Parsed JSON equals saved</text><text x="170" y="666" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Port is 8080 again</text></g><path data-from="previous" data-to="stage" d="M 310,190 H 340 V 90 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="stage" data-to="active" d="M 650,90 H 680 V 190 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="active" data-to="health" d="M 850,254 V 370" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="health" data-to="restore" d="M 850,504 V 550 H 555 V 570" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="previous" data-to="restore" d="M 170,254 V 440 H 465 V 570" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="restore" data-to="verify" d="M 370,640 H 316" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
