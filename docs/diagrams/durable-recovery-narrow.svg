<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1380" viewBox="0 0 360 1380" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Recover project context after compaction</title>
  <desc id="desc">Save task state and decisions in Beads, and retain files and evidence outside the conversation. After compaction or a restart, read those records, verify the current project and continue only permitted work. Illustrative workflow, not an automatic capture guarantee or an observed compaction test.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="work" data-to="beads" d="M 180,160 V 244" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="work" data-to="files" d="M 180,160 V 210 H 344 V 550 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="beads" data-to="recover" d="M 40,320 H 16 V 820 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="files" data-to="recover" d="M 180,620 V 744" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="recover" data-to="verify" d="M 180,890 V 974" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="verify" data-to="continue" d="M 180,1120 V 1204" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="work" data-x="180" data-y="90" data-width="280" data-height="140"><rect x="40.0" y="20.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Working session</text><text x="180" y="90.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Save decisions and evidence</text><text x="180" y="117.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">as the task progresses</text></g><g data-node="beads" data-x="180" data-y="320" data-width="280" data-height="140"><rect x="40.0" y="250.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="279.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Beads task database</text><text x="180" y="306.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Tasks and dependencies</text><text x="180" y="333.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Decisions + next task</text><text x="180" y="360.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Open work + evidence links</text></g><g data-node="files" data-x="180" data-y="550" data-width="280" data-height="140"><rect x="40.0" y="480.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="523.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Files and evidence</text><text x="180" y="550.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Code + tests + reports</text><text x="180" y="577.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Handoff + source revision</text></g><g data-node="recover" data-x="180" data-y="820" data-width="280" data-height="140"><rect x="40.0" y="750.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="793.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Recover context</text><text x="180" y="820.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">After compaction / restart</text><text x="180" y="847.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Read saved tasks and links</text></g><g data-node="verify" data-x="180" data-y="1050" data-width="280" data-height="140"><rect x="40.0" y="980.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1023.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Verify current state</text><text x="180" y="1050.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Inspect files; rerun checks</text><text x="180" y="1077.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Confirm scope and limits</text></g><g data-node="continue" data-x="180" data-y="1280" data-width="280" data-height="140"><rect x="40.0" y="1210.0" width="280" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1253.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Continue the work</text><text x="180" y="1280.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only if still permitted</text><text x="180" y="1307.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Or record what blocks it</text></g>
</svg>
