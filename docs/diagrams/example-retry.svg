<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="680" viewBox="0 0 1020 680" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">When a retry repeats the effect</title>
  <desc id="desc">Scripted exercise — deliberately authored inputs; no live service or reviewer calls. Each POST attempt adds a write effect before the stop decision. Retrying gives two attempts and two effects. Stopping gives one effect but leaves the caller uncertain. The GET trace has two attempts and no write effects. Here 503 means temporary failure and 200 means success; these are scripted statuses, not network observations.</desc>
