  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <text x="510" y="32" text-anchor="middle" font-size="22" font-weight="600">POST · retry after failure</text><g data-node="post-replay-first" data-x="170" data-y="120" data-width="280" data-height="128"><rect x="30.0" y="56.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="107" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Attempt 1</text><text x="170" y="133" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write effect 1; status 503</text></g><g data-node="post-replay-second" data-x="510" data-y="120" data-width="280" data-height="128"><rect x="370.0" y="56.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="107" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Attempt 2</text><text x="510" y="133" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write effect 2; status 200</text></g><g data-node="post-replay-result" data-x="850" data-y="120" data-width="280" data-height="96"><rect x="710.0" y="72.0" width="280" height="96" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="107" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Duplicate effect</text><text x="850" y="133" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">2 attempts · 2 effects</text></g><path data-from="post-replay-first" data-to="post-replay-second" d="M 310,120 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="post-replay-second" data-to="post-replay-result" d="M 650,120 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="510" y="252" text-anchor="middle" font-size="22" font-weight="600">POST · do not replay</text><g data-node="post-stop-first" data-x="170" data-y="340" data-width="280" data-height="128"><rect x="30.0" y="276.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="327" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Attempt 1</text><text x="170" y="353" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Write effect 1; status 503</text></g><g data-node="post-stop-second" data-x="510" data-y="340" data-width="280" data-height="128"><rect x="370.0" y="276.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="327" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Stop after failure</text><text x="510" y="353" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No second attempt</text></g><g data-node="post-stop-result" data-x="850" data-y="340" data-width="280" data-height="96"><rect x="710.0" y="292.0" width="280" height="96" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="327" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Outcome still ambiguous</text><text x="850" y="353" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">1 attempt · 1 effect</text></g><path data-from="post-stop-first" data-to="post-stop-second" d="M 310,340 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="post-stop-second" data-to="post-stop-result" d="M 650,340 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="510" y="472" text-anchor="middle" font-size="22" font-weight="600">GET · bounded retry</text><g data-node="get-first" data-x="170" data-y="560" data-width="280" data-height="128"><rect x="30.0" y="496.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="547" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Attempt 1</text><text x="170" y="573" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No write effect; status 503</text></g><g data-node="get-second" data-x="510" data-y="560" data-width="280" data-height="128"><rect x="370.0" y="496.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="547" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Attempt 2</text><text x="510" y="573" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">No write effect; status 200</text></g><g data-node="get-result" data-x="850" data-y="560" data-width="280" data-height="96"><rect x="710.0" y="512.0" width="280" height="96" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="547" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Read retry completes</text><text x="850" y="573" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">2 attempts · 0 write effects</text></g><path data-from="get-first" data-to="get-second" d="M 310,560 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="get-second" data-to="get-result" d="M 650,560 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
