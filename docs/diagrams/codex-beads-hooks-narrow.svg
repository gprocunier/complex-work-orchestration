<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1740" viewBox="0 0 360 1740" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Verify context delivery before hiding its display</title>
  <desc id="desc">Illustrative configuration decision—not a new hook installation or delivery test. Inspect the installed client. Unsupported quiet mode is rejected; keep full-context display. Supported quiet configuration retains the Beads command and adds only a presentation hint. Before adopting it, obtain host-observed evidence that the full context still reaches the model. Missing or failed evidence keeps the full-context fallback while you investigate; character count alone is not proof.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="inspect" data-to="support" d="M 180,180 V 264" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="support" data-to="quiet" d="M 180,450 V 534" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="support" data-to="full" d="M 320,360 H 344 V 860 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="quiet" data-to="delivery" d="M 40,620 H 16 V 1120 H 34" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="delivery" data-to="adopt" d="M 180,1200 V 1294" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="delivery" data-to="fallback" d="M 320,1120 H 344 V 1640 H 326" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="inspect" data-x="180" data-y="100" data-width="280" data-height="160"><rect x="40.0" y="20.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="52" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Inspect the installed</text><text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">client</text><text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Preview configuration</text><text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">first</text><text x="180" y="148" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not suppress context</text></g><g data-node="support" data-x="180" data-y="360" data-width="280" data-height="180"><polygon points="180,270.0 320.0,360 180,450.0 40.0,360" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="180" y="348" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Display hint?</text><text x="180" y="372" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Supported here?</text></g><g data-node="quiet" data-x="180" data-y="620" data-width="280" data-height="160"><rect x="40.0" y="540.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="584" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If supported · quiet</text><text x="180" y="608" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">option</text><text x="180" y="632" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep Beads command intact</text><text x="180" y="656" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Add presentation hint only</text></g><g data-node="full" data-x="180" data-y="860" data-width="280" data-height="160"><rect x="40.0" y="780.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="824" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If unsupported · full</text><text x="180" y="848" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">text</text><text x="180" y="872" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Quiet attempt is rejected</text><text x="180" y="896" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep full-context display</text></g><g data-node="delivery" data-x="180" data-y="1120" data-width="280" data-height="160"><rect x="40.0" y="1040.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1084" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Verify actual delivery</text><text x="180" y="1108" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Host observes full context</text><text x="180" y="1132" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Character count is not</text><text x="180" y="1156" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">proof</text></g><g data-node="adopt" data-x="180" data-y="1380" data-width="280" data-height="160"><rect x="40.0" y="1300.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1344" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Adopt only after proof</text><text x="180" y="1368" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Full context still</text><text x="180" y="1392" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">delivered</text><text x="180" y="1416" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Check relevant lifecycle</text></g><g data-node="fallback" data-x="180" data-y="1640" data-width="280" data-height="160"><rect x="40.0" y="1560.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="180" y="1592" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">If proof is missing or</text><text x="180" y="1616" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">fails</text><text x="180" y="1640" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep full-context display</text><text x="180" y="1664" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Investigate before</text><text x="180" y="1688" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">adoption</text></g>
</svg>
