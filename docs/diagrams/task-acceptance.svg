<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">From need to accepted work</title>
  <desc id="desc">Define the need, acceptance criteria and scope; save the work record and dependencies; permit bounded execution; check the evidence; save the owner’s decision and handoff before selecting the next ready task.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a60000"/></marker></defs>
  <path data-from="0" data-to="1" d="M 290,80 H 384" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="1" data-to="2" d="M 520,136 V 198" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="2" data-to="3" d="M 390,260 H 296" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="3" data-to="4" d="M 160,316 V 378" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="4" data-to="5" d="M 290,440 H 384" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="5" data-to="6" d="M 520,496 V 558" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="0" data-x="160" data-y="80" data-width="260" data-height="112"><rect x="30.0" y="24.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="68" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Need</text><text x="160" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">desired result</text></g><g data-node="1" data-x="520" data-y="80" data-width="260" data-height="112"><rect x="390.0" y="24.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="68" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Define acceptance</text><text x="520" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">criteria and scope</text></g><g data-node="2" data-x="520" data-y="260" data-width="260" data-height="112"><rect x="390.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Save work record</text><text x="520" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">tasks and dependencies</text></g><g data-node="3" data-x="160" data-y="260" data-width="260" data-height="112"><rect x="30.0" y="204.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="248" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Bounded execution</text><text x="160" y="272" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">within granted authority</text></g><g data-node="4" data-x="160" data-y="440" data-width="260" data-height="112"><rect x="30.0" y="384.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="160" y="428" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Check evidence</text><text x="160" y="452" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">tests and review</text></g><g data-node="5" data-x="520" data-y="440" data-width="260" data-height="112"><rect x="390.0" y="384.0" width="260" height="112" rx="6" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="416" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Save decision</text><text x="520" y="440" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">owner’s ruling and</text><text x="520" y="464" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">handoff</text></g><g data-node="6" data-x="520" data-y="620" data-width="260" data-height="112"><rect x="390.0" y="564.0" width="260" height="112" rx="32" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="520" y="596" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Next ready task</text><text x="520" y="620" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">only when prerequisites</text><text x="520" y="644" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">pass</text></g>
</svg>
