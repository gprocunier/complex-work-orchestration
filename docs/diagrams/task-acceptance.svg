<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">From request to accepted work</title>
  <desc id="desc">Define the result, requirements and allowed changes. Save tasks and dependencies, do the permitted work, check tests and reviews, then record the decision and handoff. Start dependent work only after its prerequisite is accepted.</desc>
