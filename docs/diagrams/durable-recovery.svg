<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Recover project context after compaction</title>
  <desc id="desc">Save task state and decisions in Beads, and retain files and evidence outside the conversation. After compaction or a restart, read those records, verify the current project and continue only permitted work. Illustrative workflow, not an automatic capture guarantee or an observed compaction test.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <path data-from="work" data-to="beads" d="M 320,210 H 360 V 115 H 404" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="work" data-to="files" d="M 320,210 H 360 V 325 H 404" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="beads" data-to="recover" d="M 710,115 H 760 V 180 H 794" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="files" data-to="recover" d="M 710,325 H 760 V 240 H 794" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="recover" data-to="verify" d="M 950,280 V 399" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="verify" data-to="continue" d="M 950,545 V 619" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="work" data-x="170" data-y="210" data-width="300" data-height="140"><rect x="20.0" y="140.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Working session</text><text x="170" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Save decisions and evidence</text><text x="170" y="237.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">as the task progresses</text></g><g data-node="beads" data-x="560" data-y="115" data-width="300" data-height="140"><rect x="410.0" y="45.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="560" y="74.5" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Beads task database</text><text x="560" y="101.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Tasks and dependencies</text><text x="560" y="128.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Decisions + next task</text><text x="560" y="155.5" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Open work + evidence links</text></g><g data-node="files" data-x="560" data-y="325" data-width="300" data-height="140"><rect x="410.0" y="255.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="560" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Files and evidence</text><text x="560" y="325.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Code + tests + reports</text><text x="560" y="352.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Handoff + source revision</text></g><g data-node="recover" data-x="950" data-y="210" data-width="300" data-height="140"><rect x="800.0" y="140.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="950" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Recover context</text><text x="950" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">After compaction / restart</text><text x="950" y="237.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Read saved tasks and links</text></g><g data-node="verify" data-x="950" data-y="475" data-width="300" data-height="140"><rect x="800.0" y="405.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="950" y="448.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Verify current state</text><text x="950" y="475.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Inspect files; rerun checks</text><text x="950" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Confirm scope and limits</text></g><g data-node="continue" data-x="950" data-y="695" data-width="300" data-height="140"><rect x="800.0" y="625.0" width="300" height="140" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="950" y="668.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="600">Continue the work</text><text x="950" y="695.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only if still permitted</text><text x="950" y="722.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Or record what blocks it</text></g><rect x="20" y="450" width="690" height="260" rx="12" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="46" y="495" font-size="24" font-weight="600">What compaction changes</text><text x="46" y="537" font-size="20" font-weight="400">The conversation may be summarized.</text><text x="46" y="579" font-size="20" font-weight="400">Saved task records and project files stay outside it.</text><text x="46" y="621" font-size="20" font-weight="400">Recovery uses those records—not assumed recall.</text><text x="46" y="663" font-size="20" font-weight="400">Missing or stale records still need investigation.</text>
</svg>
