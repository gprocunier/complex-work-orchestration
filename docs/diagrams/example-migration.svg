<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="900" viewBox="0 0 1020 900" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Compare converters without changing the requirements</title>
  <desc id="desc">Proposed demonstration — not executed. Save cases, compatibility requirements, scoring and the selection rule. Explicitly invoke the check before both converters use the same baseline. A runner repair must preserve that baseline and be rechecked. Changed cases or rules must not continue the old evaluation; intentionally revised requirements start a separate evaluation while preserving the original evidence. The comparison may find that neither converter qualifies. Existing component regressions are not this integrated converter comparison.</desc>
  <style id="diagram-theme">
  /* Inherited color-scheme also follows an explicit page selection. */
  @media (prefers-color-scheme: dark) {
    [fill="#151515"] { fill: #edf2f9; }
    [stroke="#151515"] { stroke: #edf2f9; }
    [fill="#fff"] { fill: #1b2d44; }
    [stroke="#fff"] { stroke: #111923; }
    [fill="#6a6e73"] { fill: #8b9db4; }
    [stroke="#6a6e73"] { stroke: #8b9db4; }
    [fill="#fff4e5"] { fill: #332a1c; }
    [stroke="#fff4e5"] { stroke: #332a1c; }
    [fill="#8f5200"] { fill: #efb46f; }
    [stroke="#8f5200"] { stroke: #efb46f; }
    [fill="#a60000"] { fill: #ff8795; }
    [stroke="#a60000"] { stroke: #ff8795; }
    [fill="#760000"] { fill: #ffb1ba; }
    [stroke="#760000"] { stroke: #ffb1ba; }
  }
</style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a60000"/></marker></defs>
  <text x="335" y="215" text-anchor="middle" font-size="18" font-weight="600">If repair is needed</text><text x="610" y="400" text-anchor="middle" font-size="18" font-weight="600">Yes · unchanged</text><text x="850" y="195" text-anchor="middle" font-size="18" font-weight="600">Changed cases or rules</text><g data-node="baseline" data-x="510" data-y="90" data-width="280" data-height="128"><path d="M 370.0,40.0 C 370.0,21.0 650.0,21.0 650.0,40.0 V 140.0 C 650.0,159.0 370.0,159.0 370.0,140.0 Z" fill="#fff" stroke="#6a6e73" stroke-width="2"/><path d="M 370.0,40.0 C 370.0,59.0 650.0,59.0 650.0,40.0" fill="none" stroke="#6a6e73" stroke-width="2"/><text x="510" y="73" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Save one baseline</text><text x="510" y="99" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Cases + compatibility</text><text x="510" y="125" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Scoring + selection rule</text></g><g data-node="repair" data-x="170" data-y="290" data-width="280" data-height="128"><rect x="30.0" y="226.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="264" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Repair the runner only</text><text x="170" y="290" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep the saved baseline</text><text x="170" y="316" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Recheck before execution</text></g><g data-node="check" data-x="510" data-y="290" data-width="280" data-height="140"><polygon points="510,220.0 650.0,290 510,360.0 370.0,290" fill="#fff4e5" stroke="#8f5200" stroke-width="2"/><text x="510" y="277" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600">Same saved rules?</text><text x="510" y="303" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Invoke the check</text></g><g data-node="converter-a" data-x="330" data-y="560" data-width="280" data-height="128"><rect x="190.0" y="496.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="330" y="534" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Converter A</text><text x="330" y="560" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Use the same cases</text><text x="330" y="586" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and the same rules</text></g><g data-node="converter-b" data-x="690" data-y="560" data-width="280" data-height="128"><rect x="550.0" y="496.0" width="280" height="128" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="690" y="534" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Converter B</text><text x="690" y="560" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Use the same cases</text><text x="690" y="586" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">and the same rules</text></g><g data-node="report" data-x="510" data-y="800" data-width="280" data-height="128"><rect x="370.0" y="736.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="774" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Compare the results</text><text x="510" y="800" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Apply the saved rule</text><text x="510" y="826" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Neither may qualify</text></g><g data-node="separate" data-x="850" data-y="290" data-width="280" data-height="128"><rect x="710.0" y="226.0" width="280" height="128" rx="28" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="264" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600">Separate evaluation</text><text x="850" y="290" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Do not continue old run</text><text x="850" y="316" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Keep its original evidence</text></g><path data-from="baseline" data-to="repair" d="M 510,154 V 185 H 170 V 220" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="baseline" data-to="check" d="M 510,154 V 214" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="repair" data-to="check" d="M 310,290 H 364" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="converter-a" d="M 510,360 V 420 H 330 V 490" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="converter-b" d="M 510,360 V 420 H 690 V 490" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="converter-a" data-to="report" d="M 330,624 V 690 H 480 V 730" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="converter-b" data-to="report" d="M 690,624 V 690 H 540 V 730" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-from="check" data-to="separate" d="M 650,290 H 704" fill="none" stroke="#a60000" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
