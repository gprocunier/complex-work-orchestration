<svg xmlns="http://www.w3.org/2000/svg" width="320" height="880" viewBox="0 0 320 880" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" fill="#151515">
  <title id="title">Compare explicit claims</title>
  <desc id="desc">Check each review, group accepted inputs by trust domain, compare matching claim fields and report agreement and disagreement. The lead resolves material differences; agreement is not proof of correctness.</desc>
