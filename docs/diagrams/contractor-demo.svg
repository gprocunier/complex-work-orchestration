<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1400" viewBox="0 0 1020 1400" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif" fill="#151515">
  <title id="title">Historical contractor ownership</title>
  <desc id="desc">Historical ownership map—not evidence of concurrent execution or a current launch recipe. Codex coordinated the work. Antigravity handled documentation and Claude Code handled Pages on separate branches. Codex reviewed and corrected the work, validated the combined candidate, then merged and retained the historical publication decision. Preparing a brief was not an actual CLI call. This record authorizes no new dispatch or publication.</desc>
