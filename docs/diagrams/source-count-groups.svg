font-size="18" font-weight="400">Two eligible model reviews</text><text x="170" y="364" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">do not add a second group</text></g><g data-node="local" data-x="850" data-y="340" data-width="280" data-height="160"><rect x="710.0" y="260.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="850" y="304" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Local aliases · one</text><text x="850" y="328" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">group</text><text x="850" y="352" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Eligible local/OpenShift</text><text x="850" y="376" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">names share default group</text></g><g data-node="count" data-x="510" data-y="590" data-width="280" data-height="160"><rect x="370.0" y="510.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="566" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Count eligible groups</text><text x="510" y="590" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Checked eligible records</text><text x="510" y="614" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Default minimum: two</text></g><g data-node="compare" data-x="510" data-y="830" data-width="280" data-height="160"><rect x="370.0" y="750.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="510" y="794" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Invoke claim</text><text x="510" y="818" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">comparison</text><text x="510" y="842" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Only with required inputs</text><text x="510" y="866" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Agreement is not truth</text></g><g data-node="excluded" data-x="170" data-y="830" data-width="280" data-height="160"><rect x="30.0" y="750.0" width="280" height="160" rx="12" fill="#fff" stroke="#6a6e73" stroke-width="2"/><text x="170" y="806" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600">Do not count these</text><text x="170" y="830" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unknown / conflicting data</text><text x="170" y="854" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400">Unbound, held, non-primary</text></g>
</svg>
