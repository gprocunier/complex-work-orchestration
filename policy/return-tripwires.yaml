{
  "version": 1,
  "description": "Contextual tripwires for contractor and worker returns, read by cwo_core.return_tripwires. A hit holds the return for adjudication; it is a heuristic signal, not injection detection or factual verification, and a return with no hit gains no authority. Patterns match one clause at a time in a normalized, lower-cased copy of the whole return, code fences and quotations included.",
  "confusables": {
    "а": "a",
    "е": "e",
    "о": "o",
    "р": "p",
    "с": "c",
    "х": "x",
    "у": "y",
    "і": "i",
    "ѕ": "s",
    "ј": "j",
    "ԁ": "d",
    "ӏ": "l",
    "һ": "h",
    "ԛ": "q",
    "ԝ": "w",
    "А": "A",
    "В": "B",
    "Е": "E",
    "К": "K",
    "М": "M",
    "Н": "H",
    "О": "O",
    "Р": "P",
    "С": "C",
    "Т": "T",
    "Х": "X",
    "У": "Y",
    "α": "a",
    "ο": "o",
    "ρ": "p",
    "ε": "e",
    "ι": "i",
    "κ": "k",
    "ν": "v",
    "τ": "t",
    "υ": "u",
    "χ": "x"
  },
  "negations": "\\b(do not|don't|dont|never|avoid(s|ed|ing)?|stop(s|ped|ping)?|rather than|instead of|refus(e|es|ed|ing)|reject(s|ed|ing)?|should not|shouldn't|must not|mustn't|no longer allow)\\b",
  "negation_note": "negations cancel a match only when they apply to its action: the action verb right after the negation (at most two adverbs between), or an action joined to it by 'or' or 'nor'. corrections cancel it only when the correcting verb is the action applied to it and the first action of its sub-clause. critiques cancel it only when no action verb governs it. context_corrections apply to the sentence that introduces a fence, where the fenced text is their object. command_words are action words that name a program, so they never govern what follows them.",
  "corrections": "\\b(remov(e|es|ed|ing)|revert(s|ed|ing)?|undo(es|ne|ing)?|delet(e|es|ed|ing)|drop(s|ped|ping)?|strip(s|ped|ping)?|fix(es|ed|ing)?)\\b",
  "critiques": "\\b(unsafe|insecure|dangerous|attacker|malicious|vulnerab\\w*|exploit\\w*|warning|caution)\\b",
  "context_corrections": "\\b(remov(e|ing)|revert(ing)?|undo(ing)?|delet(e|ing)|strip(ping)?)\\b",
  "action_verbs": [
    "add",
    "paste",
    "copy",
    "commit",
    "put",
    "upload",
    "send",
    "share",
    "include",
    "attach",
    "print",
    "echo",
    "cat",
    "export",
    "post",
    "run",
    "execute",
    "install",
    "set",
    "disable",
    "skip",
    "delete",
    "remove",
    "comment",
    "turn",
    "silence",
    "mute",
    "ignore",
    "give",
    "provide",
    "dump",
    "bypass",
    "use",
    "curl",
    "wget",
    "bash",
    "sh",
    "iex",
    "revert",
    "undo",
    "fix",
    "restore",
    "re-enable",
    "reenable",
    "keep",
    "preserve",
    "apply",
    "enable",
    "change",
    "replace",
    "write",
    "store",
    "push",
    "merge"
  ],
  "extra_action_verb_forms": [
    "committing",
    "committed",
    "undone",
    "undid"
  ],
  "command_words": [
    "curl",
    "wget",
    "bash",
    "sh",
    "iex"
  ],
  "rules": [
    {
      "id": "addressed-outcome-instruction",
      "category": "evaluator_directive",
      "pattern": "\\b(reviewing agent|review agent|evaluator|reviewer|grader|scorer|codex|claude|assistant|the agent)\\b[^;!?]{0,120}\\b(no longer appl(y|ies)|ignore|disregard|skip|mark (this|it|the return)|accept (this|it)|approve (this|it)|pass (this|it))\\b",
      "negatable": false,
      "description": "instructs the evaluator or agent to change how this return is judged"
    },
    {
      "id": "mark-return-accepted",
      "category": "evaluator_directive",
      "pattern": "\\b(mark|record|treat|score|rate|label)\\s+(this|the)\\s+(return|result|review|output|report|submission)\\s+(as\\s+)?(accepted|approved|passing|passed|safe|clean|green)\\b",
      "negatable": false,
      "description": "asks for this return to be recorded as accepted"
    },
    {
      "id": "evaluator-may-skip",
      "category": "evaluator_directive",
      "pattern": "\\b(evaluator|reviewer|review|grader|sabotage (pass|check|review)|security (pass|check|review))\\b[^;!?]{0,40}\\b(can|may|should|could|need not|needn't)\\s+(be\\s+)?(skip(ped)?|ignore(d)?|bypass(ed)?|omit(ted)?|waive(d)?)\\b",
      "negatable": false,
      "description": "tells the evaluator a check can be skipped"
    },
    {
      "id": "authority-override",
      "category": "authority_override",
      "pattern": "^\\W*(system|developer|admin|root|operator)\\s+(override|message|instruction|prompt|mode)\\b|\\b(system|developer|admin|root|operator)\\s+(override|message|instruction|prompt)\\s*:|\\byou are now (in|a|an|the)\\b|\\b(previous|prior|earlier|above|original)\\s+(constraints|instructions|rules|guidance|guardrails|policies)\\s+(are|is|have been)\\s+(void|cancel+ed|revoked|lifted|suspended|no longer)\\b|\\bignore (all |any )?(previous|prior|earlier|above) (instructions|rules|guidance)\\b",
      "negatable": false,
      "description": "claims authority over, or replaces, the agent's instructions"
    },
    {
      "id": "remote-code-execution",
      "category": "unsafe_execution",
      "pattern": "\\b(curl|wget|fetch|iwr|irm|invoke-webrequest)\\b[^|;]{0,200}\\|\\s*(sudo\\s+)?(ba|z|k|da)?sh\\b|\\b(ba|z)?sh\\s+(-c\\s+)?[\"'`]?\\s*<\\(\\s*(curl|wget)\\b|\\biex\\b[^;!?]{0,40}\\b(irm|iwr|invoke-webrequest)\\b",
      "negatable": true,
      "directive": true,
      "description": "asks to run code fetched from the network"
    },
    {
      "id": "credential-exposure",
      "category": "credential_request",
      "pattern": "\\b(add|paste|copy|commit|put|upload|send|share|include|attach|print|echo|cat|export|post)\\b[^;!?]{0,60}(\\.env\\b|~/\\.ssh|\\.ssh/|\\bid_rsa\\b|\\bid_ed25519\\b|\\bdeploy key\\b|\\bprivate key\\b|\\bsecrets?( file)?\\b|\\bcredentials?\\b|\\bapi[ _-]?keys?\\b|\\baccess tokens?\\b|\\.npmrc\\b|\\.pypirc\\b|\\bkubeconfig\\b|\\.aws/credentials\\b|\\bpasswords?\\b)",
      "negatable": true,
      "directive": true,
      "description": "asks to move secrets or credentials somewhere they can be read"
    },
    {
      "id": "scope-expansion",
      "category": "scope_expansion",
      "pattern": "\\b(paste|send|share|provide|upload|give|attach|dump)\\b[^;!?]{0,40}\\b(full|entire|whole|complete)\\s+(repo|repository|codebase|source tree|source|bead|transcript|history|conversation)\\b",
      "negatable": true,
      "directive": true,
      "description": "asks for disclosure beyond the packet"
    },
    {
      "id": "tls-verification-disabled",
      "category": "security_weakening",
      "pattern": "\\bverify\\s*=\\s*false\\b|\\bverify_ssl\\s*=\\s*false\\b|\\bcheck_hostname\\s*=\\s*false\\b|\\brejectunauthorized\\s*:\\s*false\\b|\\bnode_tls_reject_unauthorized\\s*=\\s*0\\b|\\bsslmode\\s*=\\s*disable\\b|\\bcurl\\s+(-k|--insecure)\\b|\\b(disable|turn off|skip|bypass)\\b[^;!?]{0,30}\\b(tls|ssl|certificate|cert|hostname)\\s*(verification|validation|checks?|pinning)?\\b",
      "negatable": true,
      "directive": true,
      "description": "weakens TLS verification"
    },
    {
      "id": "test-suppression",
      "category": "security_weakening",
      "pattern": "\\b(disable|skip|delete|remove|comment out|xfail|turn off|silence|mute|ignore)\\b[^;!?]{0,40}\\b(tests?|test suite|checks?|ci gates?|assertions?)\\b",
      "negatable": true,
      "directive": true,
      "negations": "\\b(do not|don't|dont|never|avoid(s|ed|ing)?|stop(s|ped|ping)?|rather than|instead of|refus(e|es|ed|ing)|reject(s|ed|ing)?|should not|shouldn't|must not|mustn't|no longer allow)\\b",
      "description": "suppresses tests or checks",
      "corrections": "\\b(keep(s|ing)?|preserv(e|es|ed|ing)|restor(e|es|ed|ing)|re-?enabl(e|es|ed|ing)|fix(es|ed|ing)?)\\b"
    },
    {
      "id": "audit-suppression",
      "category": "audit_suppression",
      "pattern": "\\b(do not|don't|dont|never|no need to|no reason to|skip|avoid|without)\\s+(log|logging|record|recording|audit|auditing|document|documenting|report|reporting|mention|mentioning|write|writing)\\b(?![^;!?]{0,40}\\b(secrets?|tokens?|keys?|passwords?|credentials?|personal data|pii|api keys?)\\b)",
      "negatable": false,
      "description": "suppresses logging, audit or reporting of the work"
    },
    {
      "id": "audit-trail-omission",
      "category": "audit_suppression",
      "pattern": "\\b(no reason|no need|unnecessary|not necessary|pointless)\\b[^;!?]{0,60}\\b(audit trail|audit log|change log|changelog|record)\\b",
      "negatable": false,
      "description": "argues for leaving work out of the audit record"
    }
  ],
  "directive_markers": "(^|[:\\-*>\\s])(please|kindly|you should|you must|you need to|go ahead and|make sure to|be sure to|remember to|just|feel free to|(?:do not|don't|dont) (?:hesitate|forget|fail) to)\\b|^\\s*([-*>]\\s*)?(\\w+\\s*:\\s*)?(add|paste|copy|commit|put|upload|send|share|include|attach|print|echo|cat|export|post|run|execute|install|set|disable|skip|delete|remove|comment|turn|silence|mute|ignore|give|provide|dump|bypass|use|curl|wget|bash|sh|iex)\\b"
}
