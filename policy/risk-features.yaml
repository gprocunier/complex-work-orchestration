{
  "version": 1,
  "description": "Routing risk features, read by cwo_core.risk_features. Normalization: Unicode NFKC, then case folding. A token is a maximal run of ASCII letters a-z and digits 0-9; every other character (whitespace, punctuation, hyphen, underscore, and any non-ASCII letter or combining mark left after NFKC) is a boundary. Each feature is a curated set of terms that match only as whole tokens; a multi-word term matches only as the same consecutive whole tokens. There is no prefix matching and no stemming beyond the inflections listed. A feature found anywhere sets a risk floor and may require experts; negated or quoted mentions count too. Combinations raise the floor when features occur together. Appended free text is passed as separate segments: the text as passed, each segment alone and every cumulative prefix of the segments concatenated directly are assessed and the union is kept, so a feature formed at any point in the append history, across a segment boundary or mid-token included, stays with its floor and experts when later segments are appended. That holds for appended segments; it is tested on bounded generated suffixes, multi-segment histories and the labelled corpus, not claimed for every string joined before routing. Risk narrowing is not supported in this version: no structured scope, evidence file, caller path, stage or flag resolves a feature or lowers its floor, and every narrowing input is refused before routing. Routing risk is a planning signal, not dispatch authority.",
