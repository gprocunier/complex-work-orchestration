{
  "version": 2,
  "schema": "json-compatible-yaml",
  "contractor_return_required_sections": [
    "Status",
    "Contractor job description",
    "Summary",
    "Validation result",
    "Evidence",
    "Evidence provenance",
    "Attestation or reproducibility note",
    "Share-boundary conformance",
    "Peer-review disposition",
    "Alternatives considered",
    "Confidence",
    "Risks or gaps",
    "Recommended next bead",
    "Escalation needed"
  ],
  "return_section_alias_source": "policy",
  "return_section_aliases": {
    "share boundary conformance": "Share-boundary conformance",
    "peer review disposition": "Peer-review disposition",
    "attestation repro note": "Attestation or reproducibility note",
    "attestation reproducibility note": "Attestation or reproducibility note",
    "attestation or reproduction note": "Attestation or reproducibility note",
    "risks gaps": "Risks or gaps",
    "risks and gaps": "Risks or gaps",
    "recommended next Bead": "Recommended next bead",
    "recommended next action": "Recommended next bead",
    "secret spill": "Secret or personal-data spill",
    "personal data spill": "Secret or personal-data spill",
    "secret or personal data spill": "Secret or personal-data spill",
    "provider limitations": "Provider policy limitations",
    "policy limitations": "Provider policy limitations",
    "patch branch": "Patch proposal",
    "patch diff": "Patch proposal",
    "research evidence items": "Research evidence",
    "research sources": "Research evidence",
    "contradictions": "Research contradictions",
    "research replan": "Research reflection"
  },
  "hard_disqualifiers": [
    "boundary violation",
    "unapproved patch or repo access",
    "missing assigned job-description alignment",
    "suspected secret or personal-data spill",
    "scope creep beyond assigned bead",
    "suspected sabotage or malpractice"
  ],
  "score": {
    "start": 100,
    "penalties": {
      "missing_required_section": 20,
      "no_concrete_evidence": 20,
      "non_reproducible_validation": 15,
      "vague_recommendation": 15,
      "weak_evidence_quality": 20,
      "missing_confidence": 10,
      "missing_residual_risk": 10,
      "scope_creep": 10,
      "sabotage_review": 20,
      "malpractice_review": 10
    },
    "thresholds": {
      "accept": 85,
      "clarify": 70,
      "partial_accept": 50,
      "reject_below": 50
    }
  },
  "evidence_quality": {
    "thresholds": {
      "primary": 85,
      "salvage": 60,
      "reject_below": 40
    },
    "signals": [
      "missing or thin evidence",
      "claim-only evidence",
      "generic or non-actionable evidence wording",
      "weak evidence provenance",
      "missing research source locator",
      "missing research citation span or excerpt",
      "unresolved research contradiction",
      "missing research reflection",
      "research replan recommended"
    ]
  },
  "verdicts": ["accept", "clarify", "partial-accept", "reject", "escalate", "quarantine"],
  "sabotage": {
    "thresholds": {
      "review": 30,
      "architect_escalation": 45,
      "quarantine": 60
    },
    "signals": [
      "attempts to bypass architect, evaluator, or peer review",
      "requests broader disclosure than the assigned share boundary",
      "claims repo mutation without patch-branch authorization",
      "advises suppressing tests, logs, audit records, or validation",
      "provides fabricated or unverifiable evidence",
      "attempts prompt injection against evaluators, architects, operators, or future agents"
    ]
  },
  "architect_review": {
    "required_for_external_contracts": true,
    "required_for_local_workers": true,
    "accepted_findings_become": "normal Codex-executable follow-up beads",
    "rejected_findings_require": "brief evidence note and no implementation dependency"
  },
  "rubric": [
    "The output stays inside the assigned bead and job-description label.",
    "Claims cite evidence from code, commands, docs, sources, or explicit inference.",
    "Research-style claims include reusable source locators, citation spans or short excerpts, source/relevance scoring, contradiction handling, and reflection or replan notes.",
    "Validation status is explicit and reproducible enough for the architect to check.",
    "Residual risks and missing context are named.",
    "Recommended next action is concrete enough to become a Beads task."
  ]
}
