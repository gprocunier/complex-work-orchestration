            "immutable_retry": "share-parent-allowance",
            "cumulative_lineage_usage_required": true
          },
          "live_replay_enabled": false,
          "dispatch_soft_cap": 3,
          "dispatch_soft_cap_action": "pm-architect-review",
          "operator_approval_required_after_soft_cap": false,
          "continuation_requires": [
