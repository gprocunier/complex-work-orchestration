          "telemetry_fields": [
            "tool_calls",
            "runtime_seconds",
            "dispatches",
            "compactions",
            "pm_replans_used",
            "architect_cycles_used",
            "counters"
          ],
          "protected_stop_reasons": [
            "aggregate-allowance-exhausted",
            "model-mismatch",
            "control-loss",
            "security-or-authority-ambiguity",
            "out-of-scope-mutation",
            "tainted-mutation",
            "invalid-trusted-evidence",
            "invalid-needs-replan-evidence",
            "invalid-completion-evidence",
            "pm-replan-exhausted",
            "architect-cycle-exhausted",
            "objective-change",
            "security-or-authority-change"
          ],
          "exploration_limits": {
            "exploration-limit": {
              "max_compactions": 0
            },
            "clean-no-artifact": {
              "max_compactions": 0
            }
          },
          "fresh-worker-reassignment": {
            "required": true,
            "event": "fresh-worker-assigned"
          },
          "main_thread_effort": {
            "capture_at": [
              "planning",
              "material-replanning"
            ],
            "sources": [
              "trusted-turn-context",
              "user-declaration"
            ],
            "required_runtime_fields": [
