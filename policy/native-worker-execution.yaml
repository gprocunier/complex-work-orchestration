{
  "version": 1,
  "schema": "json-compatible-yaml",
  "name": "native-worker-execution",
  "scope": "CWO bootstrap policy for native operative worker execution",
  "governance": {
    "sol": {
      "role": "architecture-and-adjudication-only",
      "may_authorize_worker_packets": true,
      "may_execute_operative_work": false,
      "can_assign_continuation": true
    },
    "spark": {
      "role": "operative-worker",
      "exact_model": "gpt-5.3-codex-spark",
      "session_type": "fresh-native",
      "tool_gate_required": true
    },
    "native_operative_worker": {
      "role": "operative-worker",
      "preferred_model": "gpt-5.3-codex-spark",
      "authorized_models": [
        "gpt-5.3-codex-spark",
        "gpt-5.6-luna"
      ],
      "authorized_fallback_models": [
        "gpt-5.6-luna"
      ],
      "fallback_selection": "explicit-only",
      "session_type": "fresh-native",
      "tool_gate_required": true
    }
  },
  "rollout_mode": "canary-then-enforce",
  "enforcement_mode": "fail-closed",
  "precommit_containment": {
    "version": 2,
    "active": true,
    "status": "operative-authorized",
    "scope": "native-operative-dispatch",
    "reason": "fsh.3-operative-release-gate",
    "decision": "evidence-gated",
    "authority": "policy/native-worker-execution.yaml",
    "release_requires": "complex-work-orchestration-fsh.3.5",
    "release_state_order": [
      "precommit-validated",
      "canary-authorized",
      "operative-authorized"
    ],
    "maximum_release_state": "operative-authorized",
    "operative_dispatch_authorized": true,
    "canary_operations": [
      "supervised-worker-fit-request"
    ],
    "allowed_non_operative_operations": [
      "policy-schema-validation",
      "trusted-session-inspection",
      "historical-packet-inspection",
      "structurally-nondispatchable-preview",
      "external-read-only-critic-review",
      "supervised-worker-fit-request",
      "receipt-bound-candidate-packet-build"
    ],
    "blocked_operations": [
      "worker-fit-request",
      "deterministic-fit-commitment",
      "planned-packet-build",
      "dispatchable-packet-validation",
      "operative-prompt-render",
      "supervision-start",
      "supervision-arm",
      "native-dispatch",
      "native-retry",
      "native-resume",
      "native-replay-dispatch"
    ]
  },
  "native_release_evidence": {
    "version": 1,
    "schema": "schemas/native-release-evidence.schema.json",
    "authority": "cwo-native-release-supervisor",
    "required_model": "gpt-5.3-codex-spark",
    "canary_bead": "complex-work-orchestration-fsh.3.5",
    "operative_adjudication_bead": "complex-work-orchestration-fsh.3.5",
    "max_ttl_seconds": 3600,
    "canary_operation_class": "supervised-zero-tool-fit-canary",
    "canary_authorized_operations": [
      "supervised-worker-fit-request"
    ],
    "operative_authorized_operations": [
      "dispatchable-packet-validation",
      "operative-prompt-render",
      "supervision-start",
      "supervision-arm",
      "native-dispatch",
      "native-retry",
      "native-resume",
      "native-replay-dispatch"
    ],
    "canary_repository_work_authorized": false,
    "canary_source_mutation_authorized": false,
    "canary_workspace_scope": "cwo-temp-only",
    "operative_release_enabled": true,
    "operative_release_requires": "complex-work-orchestration-fsh.3.5"
  },
  "precommit_supervision": {
    "version": 2,
    "state_schema": "schemas/native-precommit-state.schema.json",
    "receipt_schema": "schemas/native-precommit-receipt.schema.json",
    "validation_rule_version": "native-precommit-receipt:v2",
    "required_model": "gpt-5.3-codex-spark",
    "attestation_source": "trusted-control-plane-session-metadata",
    "poll_interval_ms": 1000,
    "poll_lag_tolerance_ms": 500,
    "arm_to_dispatch_max_ms": 5000,
    "packet_stage": "precommit-validated",
    "operative_dispatch_authorized": false,
    "release_requires": "complex-work-orchestration-fsh.3",
    "control_topology": "single-host-process-v1"
  },
  "native_supervision_pool": {
    "version": 1,
    "enabled": true,
    "maturity": "experimental",
    "status": "operative-authorized",
    "capacity": {
      "version": 1,
      "default_max_active_workers": 1,
      "released_max_active_workers": 2,
      "hard_max_active_workers": 3,
      "concurrency_enabled_by_default": false,
      "requires_explicit_opt_in": true,
      "requires_fresh_capability_receipt": true,
      "operator_activation_required_for_increase": true
    },
    "release_requires": "complex-work-orchestration-18w.6",
    "required_control_adapter": "native-multi-agent-v1",
    "allowed_execution_surfaces": [
      "connected-codex"
    ],
    "max_capability_ttl_seconds": 3600,
    "max_certified_check_ms": 200,
    "callback_certification": {
      "version": "live-thread-adapter-callback-certification:v2",
      "envelope": "live-thread-adapter-callback-v1",
      "scheduler_model": "nonpreemptive-edf-generalized-v2",
      "response_time_equation": "max_lifecycle+N*check+scheduler<=poll_interval",
      "observation_authority": "telemetry-only-non-authoritative",
      "certified_callback_max_ms": {
        "arm": 100,
        "send_input": 250,
        "mark_dispatched": 100,
        "check": 200,
        "interrupt": 250,
        "close": 250,
        "finalize": 100
      },
      "certified_scheduler_overhead_ms": 100
    },
    "scheduler": {
      "kind": "earliest-deadline-rotating-v1",
      "poll_interval_ms": 1000,
      "poll_lag_tolerance_ms": 1500,
      "hot_admission_allowed": false,
      "threads_allowed": false
    },
    "trusted_live_canary": {
      "runner": "scripts/run_native_pool_live_canaries.py",
      "steering_receipt_schema": "schemas/native-steering-receipt.schema.json",
      "materialization_evidence_schema": "schemas/native-session-materialization-evidence.schema.json",
      "authorization_state_schema": "schemas/native-canary-authorization-state.schema.json",
      "exact_model": "gpt-5.3-codex-spark",
      "calibration_command": "sleep 20",
      "materialization_deadline_seconds": 10,
      "poll_interval_max_ms": 250,
      "liveness_observations": 2,
      "liveness_separation_min_ms": 1000,
      "interrupt_confirmation_deadline_seconds": 5,
      "successful_turn_starts_exact": 7,
      "prestart_zero_artifact_relaunch_max": 1,
      "predecessor_lineage_artifacts_required": true,
      "spark_receipt_canonical_recompute_required": true,
      "no_resume_or_salvage": true,
      "release_on_acceptance_only": true
    },
    "single_flight_surfaces": [
      "precommit-supervision",
      "candidate-packet-construction",
      "operative-prompt-render",
      "native-retry",
      "native-resume",
      "native-replay-dispatch",
      "outside-critic-review",
      "integration",
      "publication"
    ]
  },
  "poll_interval_ms": 1000,
  "poll_lag_tolerance_ms": 1500,
  "arm_to_dispatch_max_ms": 5000,
  "control_turn_required": true,
  "segment_start_grace_seconds": 10,
  "tool_reserve": {
    "ratio": 0.1,
    "floor": 3
  },
  "runtime_reserve": {
    "ratio": 0.1,
    "floor": 5
  },
  "required_control_adapter": "native-multi-agent-v1",
  "required_capabilities": [
    "interrupt",
    "close",
    "wait"
  ],
  "proportional_execution_fast_path": {
    "enabled": true,
    "route": "native-productive-fast-path",
    "version": 1,
    "eligibility": {
      "brief_type": "cwo-proportional-execution-brief",
      "version": 1,
      "identity_required": true,
      "tool_surface_required": true,
      "model_surface_required": true,
      "single_output_artifact_required": true,
      "allowed_output_classifications": [
        "ignored",
        "ephemeral",
        "non-publishable"
      ],
      "max_estimated_lines": 500,
      "max_estimated_tool_calls": 12,
      "max_estimated_runtime_seconds": 600,
      "mutation_boundaries_required_false": [
        "tracked_source",
        "policy",
        "schema",
        "credential",
        "beads_database",
        "production"
      ],
      "access_boundaries_required_false": [
        "privileged_access",
        "secrets",
        "external_disclosure",
        "network"
      ],
      "required_unresolved_decisions_empty": [
        "architecture",
        "security",
        "policy"
      ],
      "deterministic_checks_required": true,
      "usage_buckets": [
        "productive-artifact",
        "validation",
        "orchestration-setup",
        "harness-recovery"
      ],
      "required_worker_capabilities": [
        "text",
        "json"
      ],
      "allowed_worker_capability_source": "brief-available_worker_capabilities"
    },
    "receipt": {
      "valid_receipt_reuse": true,
      "no-repeated-canary": true,
      "tool_surface": "native-productive-fast-path"
    },
    "required_steps": [
      "validate-proportional-brief",
      "evaluate-required-boundaries",
      "evaluate-usage-breakdown",
      "evaluate-visual-adjudication",
      "emit-immutable-task-evidence"
    ],
    "skipped_heavy_gates": [
      "scheduler-delay-canary",
      "tool-use-canary",
      "non-essential-policy-checks"
    ],
    "terminal_precedence": {
      "completion_vs_late_poll": "completion-wins",
      "hard_reasons_vs_completion": "hard-wins",
      "late_poll_decision": "warn",
      "startup_grace_late_poll": "warn"
    },
    "scheduler_delay": {
      "as_control_lost": false,
      "warn_reason": "poll-latency-observed"
    },
    "pm_visual_adjudication": {
      "owner": "pm",
      "trusted_screenshots_only": true,
      "image_input_required_when_owner_worker": true,
      "correction_cap": "bounded",
      "bounded_corrections": 1
    }
  },
  "operative_packet_readiness": {
    "version": 2,
    "required_marker": "operative-readiness:v2",
    "decisions": [
      "operative-ready",
      "architect-resolution-required",
      "split-required"
    ],
    "selector_grammar": [
      "whole-file",
      "lines:<start>-<end>"
    ],
    "semantic_unit_identity": "context-manifest-path-selector-sha256",
    "max_chunks_per_unit": 4,
    "limits": {
      "max_behavior_clusters": 1,
      "max_source_files": 4,
      "max_focused_test_modules": 2,
      "max_expected_diff_lines": 250,
      "max_tool_calls_p90": 18,
      "max_runtime_seconds_p90": 300,
      "max_compactions": 0,
      "max_implementation_full_suite_runs": 0
    },
    "required_frozen_decision_markers": [
      "behavior-cluster:",
      "input-contract:",
      "output-contract:",
      "state-transitions:",
      "positive-tests:",
      "negative-tests:",
      "authority:"
    ],
    "unresolved_decisions_required_empty": true,
    "result_fields": [
      "decision",
      "reasons",
      "open_decisions",
      "owned_files",
      "owned_symbols",
      "test_matrix",
      "context_unit_allowance",
      "pre_mutation_read_call_allowance",
      "total_call_allowance",
      "total_runtime_allowance"
    ]
  },
  "operative_activity_controls": {
    "version": 2,
    "categories": [
      "targeted-read",
      "broad-scan",
      "memory-read",
      "mutation",
      "focused-validation",
      "unrelated"
    ],
    "semantic_unit_identity": "context-manifest-path-selector-sha256",
    "mutation_authority": "content-aware-workspace-baseline-v2",
    "max_chunks_per_unit": 4,
    "warning": {
      "semantic_units": 3,
      "pre_mutation_read_calls": 6
    },
    "needs_replan_before": {
      "semantic_unit": 4,
      "pre_mutation_read_call": 11
    },
    "broad_scan": "deny",
    "memory_read": "exact-context-manifest-path-only",
    "recovery": {
      "pm_refinements": 1,
      "automatic_sol_replans": 1,
      "final_attempts_after_sol_replan": 1,
      "operator_approval_for_healthy_packet_correction": false,
      "aggregate_budget_shared": true,
      "budget_reset": false,
      "recursive_salvage": false
    },
    "protected_stops": [
      "model-mismatch",
      "context-compaction",
      "control-loss",
      "telemetry-unavailable",
      "security-violation",
      "authority-violation",
      "out-of-scope-mutation",
      "mutation-attribution-ambiguity",
      "incomplete-mutation-evidence",
      "contradictory-validation",
      "aggregate-budget-exhausted"
    ],
    "prohibitions": [
      "call-ordinal-first-mutation-gate",
      "recursive-salvage",
      "budget-reset",
      "operative-agent-resume",
      "non-native-bridge",
      "model-substitution",
      "sol-operative-substitution"
    ]
  },
  "missing_telemetry_control": "stop-before-dispatch",
  "validation_attempt_limit": 1,
  "recursive_validation_forbidden": true,
  "packet_versions": {
    "emitted": 2,
    "historical": [
      1
    ],
    "dispatchable": [
      2
    ]
  },
  "packet_v3": {
    "experimental_only": true,
    "dispatchable": false,
    "autonomous_retry": false,
    "phases": {
      "review": {
        "expected_artifact_class": "review-report",
        "permitted_first_action_classes": [
          "read",
          "test"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "no-source-mutation"
      },
      "implementation": {
        "expected_artifact_class": "implementation-patch",
        "permitted_first_action_classes": [
          "read"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": 900,
        "source_mutation_policy": "scoped-only"
      },
      "validation": {
        "expected_artifact_class": "validation-report",
        "permitted_first_action_classes": [
          "read",
          "test"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "no-source-mutation"
      },
      "publish/report/admin": {
        "expected_artifact_class": "publish-report",
        "permitted_first_action_classes": [
          "read",
          "publish",
          "control"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "explicitly-authorized-only"
      }
    },
    "recovery": {
      "enabled": false,
      "autonomous_replay": false,
      "max_retries": 0,
      "requires_fresh_session": true,
      "incomplete_baseline_disables_replay": true
    },
    "lineage": {
      "attempts": [
        0,
        1
      ],
      "maximum_validation_attempts": 1,
      "recursive_validation_forbidden": true
    }
  },
  "execution_bootstrap": {
    "spawn": {
      "attestation_gate": {
        "required": true,
        "tool_mode": "no-tools",
        "model_authority": "trusted-control-plane-session-metadata",
        "self_report_authority": "forbidden",
        "required_actual_model_source": "packet.requested_model"
      }
    },
    "segmenting": {
      "new_task_segment": {
        "new_attestation_boundary": true
      },
      "resume_agent": {
        "default": "forbidden",
        "waived_mode": "quarantined",
        "waiver_release_condition": "post-resume model attestation exactly matches packet.requested_model"
      }
    },
    "model_mismatch": {
      "action": "quarantine_output",
      "required_follow_up": "fresh-native-operative-worker-redispatch",
      "return_status": "model-mismatch"
    },
    "durable_continuation": {
      "checkpoint": "beads",
      "worker_rotation": "fresh-native-worker-per-segment",
      "agent_resume_model": "disallowed"
    }
  },
  "lane_budgets": {
    "implementation": {
      "tool_calls_soft": 60,
      "tool_calls_hard": 100,
      "runtime_seconds_soft": 720,
      "runtime_seconds_hard": 1080,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "validation": {
      "tool_calls_soft": 30,
      "tool_calls_hard": 50,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 1
    },
    "review": {
      "tool_calls_soft": 40,
      "tool_calls_hard": 60,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "publish-report-admin": {
      "tool_calls_soft": 25,
      "tool_calls_hard": 40,
      "runtime_seconds_soft": 300,
      "runtime_seconds_hard": 480,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    }
  },
  "return_statuses": [
    "completed",
    "blocked",
    "needs-replan",
    "needs-architect-realignment",
    "budget-exhausted",
    "model-mismatch"
  ],
  "disposition_policy": {
    "version": 1,
    "automatic_sol_breakfix": false,
    "session_dispositions": [
      "accepted",
      "accepted-with-warning",
      "quarantined"
    ],
    "artifact_dispositions": [
      "accepted",
      "independent-validation-required",
      "architect-adjudication-required",
      "rejected"
    ],
    "validation_attempt_limit": 1,
    "precedence": [
      "model-mismatch",
      "compaction",
      "validation-outcome",
      "budget-only",
      "soft-warning",
      "accepted"
    ],
    "rules": {
      "model_mismatch": "quarantined-session/rejected-artifact",
      "compaction": "quarantined-session/architect-adjudication-required",
      "budget_only": "quarantined-session/one-independent-validation-attempt",
      "validation_failed": "rejected-artifact/no-further-attempt",
      "validation_passed": "accepted-artifact",
      "non_budget_realignment": "quarantined-session/architect-adjudication-required"
    }
  },
  "sol_breakfix": {
    "default": "forbidden",
    "automatic_selection_forbidden": true,
    "required_approval_source": "explicit-operator-in-current-interaction",
    "required_bead_record": true,
    "required_warning": "Sol operative execution violates normal architecture/worker swimlanes.",
    "allowed_scope": "self-hosting incident repair only",
    "forbidden_reasons": [
      "convenience",
      "speed",
      "quota substitution",
      "ordinary feature work"
    ],
    "independent_validation_required": true,
    "expires_at_authorized_bead_closure": true
  },
  "alignment_triggers": {
    "needs_architect_realignment": {
      "distinct_soft_limits_required": 2,
      "any_hard_limit": "realignment",
      "any_compaction": "hard-stop/realignment",
      "status": "needs-architect-realignment"
    }
  },
  "realignment_return_contract": {
    "required_fields": [
      "completed_evidence",
      "files_touched",
      "mutation_state",
      "decision_required",
      "bounded_options",
      "recommendation",
      "remaining_scope",
      "usage",
      "session_disposition",
      "artifact_disposition",
      "artifact_validation"
    ],
    "worker_mutation_policy": "stop_mutating",
    "decision_owner": "architect",
    "execution_sequence": [
      "fix",
      "reload",
      "resume"
    ],
    "resume_from": "beads",
    "resume_sequence_notes": "Reinstall/reload the skill and resume from Beads; never resume operative agent sessions."
  },
  "needs_replan_return_contract": {
    "reason_codes": [
      "hidden-coupling",
      "scope-growth",
      "unexpected-reasoning",
      "decision-uncertainty",
      "environment"
    ],
    "uncertainty_classes": [
      "bounded",
      "material",
      "architect"
    ],
    "decisions": [
      "pm-refine",
      "architect-reasoning",
      "reassign-spark"
    ],
    "option_routes": [
      "pm-refine",
      "architect-reasoning",
      "reassign-spark",
      "protected-stop"
    ],
    "worker_mutation_policy": "stop-mutating",
    "decision_owner": "pm-or-architect-by-typed-decision",
    "max_pm_refinements_per_work_unit": 1,
    "routine_operator_approval_required": false
  },
  "native_model_capability": {
    "version": 1,
    "states": [
      "configured",
      "advertised",
      "spawn-accepted",
      "attested",
      "dispatchable"
    ],
    "dispatchable_requires": [
      "configured",
      "spawn-accepted",
      "attested-exact-model"
    ],
    "advertisement": {
      "authority": "advisory-telemetry",
      "omission_outcome": "advertisement-mismatch",
      "omission_action": "zero-tool-canary-or-applicable-receipt"
    },
    "outcomes": {
      "advertisement_mismatch": "warning-canary-required",
      "native_spawn_rejected": "hard-stop",
      "native_attestation_mismatch": "quarantine-hard-stop",
      "native_capability_confirmed": "dispatchable"
    },
    "receipt": {
      "type": "cwo-native-model-capability-receipt",
      "version": 1,
      "schema": "schemas/native-model-capability-receipt.schema.json",
      "scope": "active-native-tool-surface",
      "authority": "trusted-session-jsonl",
      "cache_generated_registry": false
    },
    "hard_stops": [
      "native-spawn-rejected",
      "native-attestation-mismatch",
      "canary-tool-use",
      "canary-compaction",
      "unavailable-trusted-telemetry",
      "unauthorized-model",
      "missing-closure"
    ],
    "prohibitions": [
      "model-substitution",
      "non-native-bridge",
      "operative-agent-resume",
      "generated-cache-edit",
      "binary-patch",
      "model-self-report-authority"
    ]
  },
  "bounded_native_retry": {
    "version": 1,
    "enabled": true,
    "max_retries": 1,
    "eligible_semantic_statuses": [
      "delivery-failed",
      "no-artifact",
      "no-progress"
    ],
    "eligible_interrupt_reasons": [
      "delivery-failure",
      "no-progress",
      "tool-call-interrupt-threshold",
      "runtime-interrupt-threshold"
    ],
    "authority": "cwo-native-supervisor-evidence",
    "actual_spawn_owner": "native-pm-controller",
    "operator_approval_required": false,
    "immutable_work_hash_required": true,
    "aggregate_budget_shared": true,
    "fresh_retry_session_required": true,
    "exact_model_attestation_required": true,
    "authorization_receipt": {
      "type": "cwo-native-retry-authorization",
      "version": 1,
      "schema": "schemas/native-retry-authorization.schema.json",
      "next_action": "spawn-fresh-native-retry"
    },
    "hard_stops": [
      "model-mismatch",
      "context-compaction",
      "control-loss",
      "security-violation",
      "workspace-mutation",
      "workspace-attribution-ambiguity",
      "invalid-semantic-evidence",
