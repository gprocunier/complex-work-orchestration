{
  "version": 1,
  "schema": "json-compatible-yaml",
  "name": "native-worker-execution",
  "scope": "CWO bootstrap policy for native operative worker execution",
  "governance": {
    "sol": {
      "role": "architecture-and-adjudication-only",
      "may_authorize_worker_packets": true,
      "may_execute_operative_work": false,
      "can_assign_continuation": true
    },
    "spark": {
      "role": "operative-worker",
      "exact_model": "gpt-5.3-codex-spark",
      "session_type": "fresh-native",
      "tool_gate_required": true
    },
    "native_operative_worker": {
      "role": "operative-worker",
      "preferred_model": "gpt-5.3-codex-spark",
      "authorized_models": [
        "gpt-5.3-codex-spark",
        "gpt-5.6-luna"
      ],
      "authorized_fallback_models": [
        "gpt-5.6-luna"
      ],
      "fallback_selection": "explicit-only",
      "session_type": "fresh-native",
      "tool_gate_required": true
    }
  },
  "rollout_mode": "canary-then-enforce",
  "enforcement_mode": "fail-closed",
  "poll_interval_ms": 1000,
  "poll_lag_tolerance_ms": 1500,
  "arm_to_dispatch_max_ms": 5000,
  "control_turn_required": true,
  "segment_start_grace_seconds": 10,
  "tool_reserve": {
    "ratio": 0.1,
    "floor": 3
  },
  "runtime_reserve": {
    "ratio": 0.1,
    "floor": 5
  },
  "required_control_adapter": "native-multi-agent-v1",
  "required_capabilities": [
    "interrupt",
    "close",
    "wait"
  ],
  "missing_telemetry_control": "stop-before-dispatch",
  "validation_attempt_limit": 1,
  "recursive_validation_forbidden": true,
  "packet_versions": {
    "emitted": 2,
    "historical": [
      1
    ],
    "dispatchable": [
      2
    ]
  },
  "packet_v3": {
    "experimental_only": true,
    "dispatchable": false,
    "autonomous_retry": false,
    "phases": {
      "review": {
        "expected_artifact_class": "review-report",
        "permitted_first_action_classes": [
          "read",
          "test"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "no-source-mutation"
      },
      "implementation": {
        "expected_artifact_class": "implementation-patch",
        "permitted_first_action_classes": [
          "read"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": 900,
        "source_mutation_policy": "scoped-only"
      },
      "validation": {
        "expected_artifact_class": "validation-report",
        "permitted_first_action_classes": [
          "read",
          "test"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "no-source-mutation"
      },
      "publish/report/admin": {
        "expected_artifact_class": "publish-report",
        "permitted_first_action_classes": [
          "read",
          "publish",
          "control"
        ],
        "first_action_deadline_seconds": 30,
        "mutation_deadline_seconds": null,
        "source_mutation_policy": "explicitly-authorized-only"
      }
    },
    "recovery": {
      "enabled": false,
      "autonomous_replay": false,
      "max_retries": 0,
      "requires_fresh_session": true,
      "incomplete_baseline_disables_replay": true
    },
    "lineage": {
      "attempts": [
        0,
        1
      ],
      "maximum_validation_attempts": 1,
      "recursive_validation_forbidden": true
    }
  },
  "execution_bootstrap": {
    "spawn": {
      "attestation_gate": {
        "required": true,
        "tool_mode": "no-tools",
        "model_authority": "trusted-control-plane-session-metadata",
        "self_report_authority": "forbidden",
        "required_actual_model_source": "packet.requested_model"
      }
    },
    "segmenting": {
      "new_task_segment": {
        "new_attestation_boundary": true
      },
      "resume_agent": {
        "default": "forbidden",
        "waived_mode": "quarantined",
        "waiver_release_condition": "post-resume model attestation exactly matches packet.requested_model"
      }
    },
    "model_mismatch": {
      "action": "quarantine_output",
      "required_follow_up": "fresh-native-operative-worker-redispatch",
      "return_status": "model-mismatch"
    },
    "durable_continuation": {
      "checkpoint": "beads",
      "worker_rotation": "fresh-native-worker-per-segment",
      "agent_resume_model": "disallowed"
    }
  },
  "lane_budgets": {
    "implementation": {
      "tool_calls_soft": 60,
      "tool_calls_hard": 100,
      "runtime_seconds_soft": 720,
      "runtime_seconds_hard": 1080,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "validation": {
      "tool_calls_soft": 30,
      "tool_calls_hard": 50,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 1
    },
    "review": {
      "tool_calls_soft": 40,
      "tool_calls_hard": 60,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "publish-report-admin": {
      "tool_calls_soft": 25,
      "tool_calls_hard": 40,
      "runtime_seconds_soft": 300,
      "runtime_seconds_hard": 480,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    }
  },
  "return_statuses": [
    "completed",
    "blocked",
    "needs-replan",
    "needs-architect-realignment",
    "budget-exhausted",
    "model-mismatch"
  ],
  "disposition_policy": {
    "version": 1,
    "automatic_sol_breakfix": false,
    "session_dispositions": [
      "accepted",
      "accepted-with-warning",
      "quarantined"
    ],
    "artifact_dispositions": [
      "accepted",
      "independent-validation-required",
      "architect-adjudication-required",
      "rejected"
    ],
    "validation_attempt_limit": 1,
    "precedence": [
      "model-mismatch",
      "compaction",
      "validation-outcome",
      "budget-only",
      "soft-warning",
      "accepted"
    ],
    "rules": {
      "model_mismatch": "quarantined-session/rejected-artifact",
      "compaction": "quarantined-session/architect-adjudication-required",
      "budget_only": "quarantined-session/one-independent-validation-attempt",
      "validation_failed": "rejected-artifact/no-further-attempt",
      "validation_passed": "accepted-artifact",
      "non_budget_realignment": "quarantined-session/architect-adjudication-required"
    }
  },
  "sol_breakfix": {
    "default": "forbidden",
    "automatic_selection_forbidden": true,
    "required_approval_source": "explicit-operator-in-current-interaction",
    "required_bead_record": true,
    "required_warning": "Sol operative execution violates normal architecture/worker swimlanes.",
    "allowed_scope": "self-hosting incident repair only",
    "forbidden_reasons": [
      "convenience",
      "speed",
      "quota substitution",
      "ordinary feature work"
    ],
    "independent_validation_required": true,
    "expires_at_authorized_bead_closure": true
  },
  "alignment_triggers": {
    "needs_architect_realignment": {
      "distinct_soft_limits_required": 2,
      "any_hard_limit": "realignment",
      "any_compaction": "hard-stop/realignment",
      "status": "needs-architect-realignment"
    }
  },
  "realignment_return_contract": {
    "required_fields": [
      "completed_evidence",
      "files_touched",
      "mutation_state",
      "decision_required",
      "bounded_options",
      "recommendation",
      "remaining_scope",
      "usage",
      "session_disposition",
      "artifact_disposition",
      "artifact_validation"
    ],
    "worker_mutation_policy": "stop_mutating",
    "decision_owner": "architect",
    "execution_sequence": [
      "fix",
      "reload",
      "resume"
    ],
    "resume_from": "beads",
    "resume_sequence_notes": "Reinstall/reload the skill and resume from Beads; never resume operative agent sessions."
  },
  "needs_replan_return_contract": {
    "reason_codes": [
      "hidden-coupling",
      "scope-growth",
      "unexpected-reasoning",
      "decision-uncertainty",
      "environment"
    ],
    "uncertainty_classes": [
      "bounded",
      "material",
      "architect"
    ],
    "decisions": [
      "pm-refine",
      "architect-reasoning",
      "reassign-spark"
    ],
    "option_routes": [
      "pm-refine",
      "architect-reasoning",
      "reassign-spark",
      "protected-stop"
    ],
    "worker_mutation_policy": "stop-mutating",
    "decision_owner": "pm-or-architect-by-typed-decision",
    "max_pm_refinements_per_work_unit": 1,
    "routine_operator_approval_required": false
  },
  "native_model_capability": {
    "version": 1,
    "states": [
      "configured",
      "advertised",
      "spawn-accepted",
      "attested",
      "dispatchable"
    ],
    "dispatchable_requires": [
      "configured",
      "spawn-accepted",
      "attested-exact-model"
    ],
    "advertisement": {
      "authority": "advisory-telemetry",
      "omission_outcome": "advertisement-mismatch",
      "omission_action": "zero-tool-canary-or-applicable-receipt"
    },
    "outcomes": {
      "advertisement_mismatch": "warning-canary-required",
      "native_spawn_rejected": "hard-stop",
      "native_attestation_mismatch": "quarantine-hard-stop",
      "native_capability_confirmed": "dispatchable"
    },
    "receipt": {
      "type": "cwo-native-model-capability-receipt",
      "version": 1,
      "schema": "schemas/native-model-capability-receipt.schema.json",
      "scope": "active-native-tool-surface",
      "authority": "trusted-session-jsonl",
      "cache_generated_registry": false
    },
    "hard_stops": [
      "native-spawn-rejected",
      "native-attestation-mismatch",
      "canary-tool-use",
      "canary-compaction",
      "unavailable-trusted-telemetry",
      "unauthorized-model",
      "missing-closure"
    ],
    "prohibitions": [
      "model-substitution",
      "non-native-bridge",
      "operative-agent-resume",
      "generated-cache-edit",
      "binary-patch",
      "model-self-report-authority"
    ]
  },
  "bounded_native_retry": {
    "version": 1,
    "enabled": true,
    "max_retries": 1,
    "eligible_semantic_statuses": [
      "delivery-failed",
      "no-artifact",
      "no-progress"
    ],
    "eligible_interrupt_reasons": [
      "delivery-failure",
      "no-progress",
      "tool-call-interrupt-threshold",
      "runtime-interrupt-threshold"
    ],
    "authority": "cwo-native-supervisor-evidence",
    "actual_spawn_owner": "native-pm-controller",
    "operator_approval_required": false,
    "immutable_work_hash_required": true,
    "aggregate_budget_shared": true,
    "fresh_retry_session_required": true,
    "exact_model_attestation_required": true,
    "authorization_receipt": {
      "type": "cwo-native-retry-authorization",
      "version": 1,
      "schema": "schemas/native-retry-authorization.schema.json",
      "next_action": "spawn-fresh-native-retry"
    },
    "hard_stops": [
      "model-mismatch",
      "context-compaction",
      "control-loss",
      "security-violation",
      "workspace-mutation",
      "workspace-attribution-ambiguity",
      "invalid-semantic-evidence",
      "retry-exhausted",
      "aggregate-allowance-exhausted",
      "immutable-work-hash-mismatch"
    ],
    "prohibitions": [
      "model-substitution",
      "non-native-bridge",
      "operative-agent-resume",
      "sol-operative-substitution",
      "automatic-salvage-chain"
    ]
  },
  "work_sizing": {
    "version": 1,
    "enforcement": {
      "foundation-canary": {
        "estimate_contract_versions": {
          "historical": [
            1
          ],
          "dispatchable": [
            2
          ]
        },
        "commitment": {
          "required_for_dispatch": true,
          "receipt_type": "cwo-native-worker-fit-commitment",
          "version": 1,
          "decisions": [
            "accept",
            "pm-realignment",
            "architect-realignment"
          ],
          "dispatchable_decision": "accept",
          "min_confidence": 0.75,
          "precommitment_tool_calls": 0,
          "precommitment_compactions": 0,
          "attestation_source": "trusted-session-jsonl",
          "positive_estimates_required": true,
          "estimate_bound": "within-work-plan-aggregate-hard-allowance",
          "normalization": {
            "passes": 1,
            "deterministic": true,
            "model_formatting_retry": false,
            "decision_aliases": {
              "accept": [
                "accept",
                "approve",
                "proceed"
              ],
              "pm-realignment": [
                "refine",
                "refinement"
              ],
              "architect-realignment": [
                "architect"
              ]
            },
            "missing_quantiles": "pm-realignment",
            "mixed_labels": "pm-realignment",
            "contradictions": "pm-realignment",
            "ambiguity": "pm-realignment",
            "accepted_requires": {
              "exact_work_hash": true,
              "trusted_session": true,
              "trusted_model": true,
              "numeric_quantiles": true,
              "numeric_confidence": true
            }
          }
        },
        "task_class_policy": {
          "literal-command": {
            "fit_mode": "deterministic",
            "max_task_outcomes": 1,
            "max_source_paths": 0,
            "max_source_mutation_count": 0,
            "max_read_context_count": 0,
            "max_focused_test_count": 0,
            "max_command_count": 1,
            "max_check_count": 2,
            "max_full_suite_count": 0,
            "requires_exact_argv": true,
            "tool_calls_p50": 1,
            "tool_calls_p90": 2,
            "tool_calls_hard": 4,
            "runtime_seconds_p50": 30,
            "runtime_seconds_p90": 60,
            "runtime_seconds_hard": 120
          },
          "read-only-validation": {
            "fit_mode": "deterministic",
            "max_task_outcomes": 1,
            "max_source_paths": 0,
            "max_source_mutation_count": 0,
            "max_read_context_count": 12,
            "max_focused_test_count": 6,
            "max_command_count": 6,
            "max_check_count": 6,
            "max_full_suite_count": 1,
            "requires_exact_argv": true,
            "tool_calls_p50": 2,
            "tool_calls_p90": 4,
            "tool_calls_hard": 8,
            "runtime_seconds_p50": 150,
            "runtime_seconds_p90": 300,
            "runtime_seconds_hard": 600
          },
          "narrow-mechanical": {
            "fit_mode": "deterministic",
            "max_task_outcomes": 1,
            "max_source_paths": 2,
            "max_source_mutation_count": 2,
            "max_read_context_count": 4,
            "max_focused_test_count": 2,
            "max_command_count": 4,
            "max_check_count": 4,
            "max_full_suite_count": 0,
            "max_estimated_diff_p90": 50,
            "requires_exact_argv": false,
            "tool_calls_p50": 4,
            "tool_calls_p90": 6,
            "tool_calls_hard": 10,
            "runtime_seconds_p50": 90,
            "runtime_seconds_p90": 180,
            "runtime_seconds_hard": 300
          },
          "bounded-implementation": {
            "fit_mode": "semantic",
            "max_task_outcomes": 4,
            "max_source_paths": 6,
            "max_source_mutation_count": 6,
            "max_read_context_count": 12,
            "max_focused_test_count": 6,
            "max_command_count": 8,
            "max_check_count": 6,
            "max_full_suite_count": 1,
            "max_estimated_diff_p90": 350,
            "requires_exact_argv": false,
            "tool_calls_p50": 15,
            "tool_calls_p90": 25,
            "tool_calls_hard": 37,
            "runtime_seconds_p50": 240,
            "runtime_seconds_p90": 480,
            "runtime_seconds_hard": 720
          },
          "diagnosis": {
            "fit_mode": "semantic",
            "max_task_outcomes": 2,
            "max_source_paths": 0,
            "max_source_mutation_count": 0,
            "max_read_context_count": 12,
            "max_focused_test_count": 4,
            "max_command_count": 6,
            "max_check_count": 4,
            "max_full_suite_count": 0,
            "requires_exact_argv": false,
            "tool_calls_p50": 6,
            "tool_calls_p90": 12,
            "tool_calls_hard": 18,
            "runtime_seconds_p50": 150,
            "runtime_seconds_p90": 300,
            "runtime_seconds_hard": 480
          },
          "architecture": {
            "fit_mode": "architect",
            "max_task_outcomes": 4,
            "max_source_paths": 0,
            "max_source_mutation_count": 0,
            "max_read_context_count": 12,
            "max_focused_test_count": 0,
            "max_command_count": 0,
            "max_check_count": 4,
            "max_full_suite_count": 0,
            "requires_exact_argv": false
          }
        },
        "protected_surfaces": {
          "security-return-acceptance": [
            "scripts/evaluate_return.py",
            "scripts/normalize_contractor_return.py",
            "scripts/cwo_core/returns.py",
            "schemas/*return*.schema.json"
          ],
          "policy-routing": [
            "policy/*",
            "scripts/route_work.py",
            "scripts/cwo_core/work_sizing.py",
            "scripts/prepare_native_worker.py"
          ],
          "schemas-public-contracts": [
            "schemas/*",
            "SKILL.md",
            "README.md",
            "references/*",
            "docs/*"
          ],
          "native-supervision-self-hosting": [
            "scripts/supervise_native_worker.py",
            "scripts/check_native_worker_session.py",
            "scripts/cwo_core/native_*.py"
          ],
          "provider-access-authority": [
            "policy/*registry*.yaml",
