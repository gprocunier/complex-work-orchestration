{
  "version": 1,
  "schema": "json-compatible-yaml",
  "name": "native-worker-execution",
  "scope": "CWO bootstrap policy for native operative worker execution",
  "governance": {
    "sol": {
      "role": "architecture-and-adjudication-only",
      "may_authorize_worker_packets": true,
      "may_execute_operative_work": false,
      "can_assign_continuation": true
    },
    "spark": {
      "role": "operative-worker",
      "exact_model": "gpt-5.3-codex-spark",
      "session_type": "fresh-native",
      "tool_gate_required": true
    }
  },
  "execution_bootstrap": {
    "spawn": {
      "attestation_gate": {
        "required": true,
        "tool_mode": "no-tools",
        "model_authority": "trusted-control-plane-session-metadata",
        "self_report_authority": "forbidden",
        "required_actual_model": "gpt-5.3-codex-spark"
      }
    },
    "segmenting": {
      "new_task_segment": {
        "new_attestation_boundary": true
      },
      "resume_agent": {
        "default": "forbidden",
        "waived_mode": "quarantined",
        "waiver_release_condition": "post-resume model attestation exactly matches gpt-5.3-codex-spark"
      }
    },
    "model_mismatch": {
      "action": "quarantine_output",
      "required_follow_up": "fresh-native-spark-redispatch",
      "return_status": "model-mismatch"
    },
    "durable_continuation": {
      "checkpoint": "beads",
      "worker_rotation": "fresh-native-worker-per-segment",
      "agent_resume_model": "disallowed"
    }
  },
  "lane_budgets": {
    "implementation": {
      "tool_calls_soft": 60,
      "tool_calls_hard": 100,
      "runtime_seconds_soft": 720,
      "runtime_seconds_hard": 1080,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "validation": {
      "tool_calls_soft": 30,
      "tool_calls_hard": 50,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 1
    },
    "review": {
      "tool_calls_soft": 40,
      "tool_calls_hard": 60,
      "runtime_seconds_soft": 480,
      "runtime_seconds_hard": 720,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    },
    "publish-report-admin": {
      "tool_calls_soft": 25,
      "tool_calls_hard": 40,
      "runtime_seconds_soft": 300,
      "runtime_seconds_hard": 480,
      "max_compactions": 0,
      "max_full_suite_runs": 0
    }
  },
  "return_statuses": [
    "completed",
    "blocked",
    "needs-architect-realignment",
    "budget-exhausted",
    "model-mismatch"
  ],
  "alignment_triggers": {
    "needs_architect_realignment": {
      "distinct_soft_limits_required": 2,
      "any_hard_limit": "realignment",
      "any_compaction": "hard-stop/realignment",
      "status": "needs-architect-realignment"
    }
  },
  "realignment_return_contract": {
    "required_fields": [
      "completed_evidence",
      "files_touched",
      "mutation_state",
      "decision_required",
      "bounded_options",
      "recommendation",
      "remaining_scope",
      "usage"
    ],
    "worker_mutation_policy": "stop_mutating",
    "decision_owner": "architect",
    "execution_sequence": [
      "fix",
      "reload",
      "resume"
    ],
    "resume_from": "beads",
    "resume_sequence_notes": "Reinstall/reload the skill and resume from Beads; never resume operative agent sessions."
  },
  "resume_notes": {
    "operator_control": "Fresh Spark is required for all re-executes. Operative agent resume is not permitted unless explicitly waived and re-attested."
  }
}
