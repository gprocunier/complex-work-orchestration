{
  "version": 1,
  "description": "Rules for cwo_core.outbound_screen, the final-bytes screen run immediately before content leaves the machine. These rules are maintained separately from the packet redaction rules in share-boundaries.yaml.",
  "token_prefixes": [
    {"prefix": "ghp_", "min_tail": 20},
    {"prefix": "gho_", "min_tail": 20},
    {"prefix": "ghu_", "min_tail": 20},
    {"prefix": "ghs_", "min_tail": 20},
    {"prefix": "ghr_", "min_tail": 20},
    {"prefix": "github_pat_", "min_tail": 20},
    {"prefix": "glpat-", "min_tail": 16},
    {"prefix": "xoxb-", "min_tail": 10},
    {"prefix": "xoxp-", "min_tail": 10},
    {"prefix": "xoxa-", "min_tail": 10},
    {"prefix": "xoxr-", "min_tail": 10},
    {"prefix": "xoxs-", "min_tail": 10},
    {"prefix": "sk-ant-", "min_tail": 12},
    {"prefix": "sk-proj-", "min_tail": 16},
    {"prefix": "sk-", "min_tail": 20},
    {"prefix": "sk_live_", "min_tail": 12},
    {"prefix": "sk_test_", "min_tail": 12},
    {"prefix": "rk_live_", "min_tail": 12},
    {"prefix": "AKIA", "min_tail": 16},
    {"prefix": "ASIA", "min_tail": 16},
    {"prefix": "AIza", "min_tail": 30},
    {"prefix": "ya29.", "min_tail": 20},
    {"prefix": "npm_", "min_tail": 30},
    {"prefix": "pypi-", "min_tail": 30},
    {"prefix": "dop_v1_", "min_tail": 30},
    {"prefix": "shpat_", "min_tail": 20},
    {"prefix": "hooks.slack.com/services/", "min_tail": 10}
  ],
  "secret_name_segments": ["password", "passwd", "pwd", "pass", "passphrase", "secret", "secrets", "token", "tokens", "apikey", "pin", "credential", "credentials", "cookie"],
  "secret_name_pairs": [["api", "key"], ["access", "key"], ["private", "key"], ["client", "secret"], ["secret", "key"], ["auth", "token"], ["session", "token"], ["refresh", "token"]],
  "phrase_names": ["passphrase", "mnemonic", "seed phrase", "recovery phrase"],
  "secret_headers": ["authorization", "proxy-authorization", "x-api-key", "x-auth-token", "private-token", "cookie", "set-cookie", "x-amz-security-token"],
  "secret_cli_flags": ["password", "passwd", "token", "secret", "api-key", "apikey", "access-key", "secret-key", "client-secret", "credentials", "auth-token"],
  "role_email_local_parts": ["security", "support", "info", "contact", "abuse", "noreply", "no-reply", "help", "privacy", "legal", "webmaster", "postmaster", "hostmaster", "press", "sales"],
  "placeholder_values": ["changeme", "example", "placeholder", "redacted", "none", "null", "true", "false", "secret", "password", "token", "xxx", "todo", "tbd", "your_password", "your-password", "your_token", "your-token"],
  "placeholder_patterns": ["^<[a-z][a-z _-]{0,40}>$", "^\\$\\{[A-Za-z_][A-Za-z0-9_]*\\}$", "^\\$[A-Za-z_][A-Za-z0-9_]*$", "^\\{\\{\\s*[A-Za-z_][A-Za-z0-9_.]*\\s*\\}\\}$", "^\\[REDACTED\\]$", "^\\*+$", "^[xX]{3,}$", "^\\.{3,}$", "^(?i:(your|my)[-_ ](password|passwd|pass|token|secret|api[-_ ]?key|key|credentials?))$", "^%\\(?[A-Za-z_]+\\)?s?$"],
  "confusables": {
    "а": "a", "е": "e", "о": "o", "р": "p", "с": "c", "х": "x", "у": "y", "і": "i", "ѕ": "s", "ј": "j", "ԁ": "d", "ӏ": "l", "һ": "h", "ԛ": "q", "ԝ": "w",
    "А": "A", "В": "B", "Е": "E", "К": "K", "М": "M", "Н": "H", "О": "O", "Р": "P", "С": "C", "Т": "T", "Х": "X", "У": "Y",
    "α": "a", "ο": "o", "ρ": "p", "ε": "e", "ι": "i", "κ": "k", "ν": "v", "τ": "t", "υ": "u", "χ": "x",
    "Α": "A", "Β": "B", "Ε": "E", "Ζ": "Z", "Η": "H", "Ι": "I", "Κ": "K", "Μ": "M", "Ν": "N", "Ο": "O", "Ρ": "P", "Τ": "T", "Υ": "Y", "Χ": "X"
  },
  "entropy": {"mixed_min_length": 24, "mixed_min_bits": 3.8, "long_min_length": 40, "long_min_bits": 4.3},
  "pii": {"email": "uncertain", "phone": "uncertain", "ssn": "certain"},
  "limits": {"max_input_bytes": 2097152, "max_json_depth": 64}
}
